<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#040711">
<title>Espejo Presencia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Sistema Presencia (Agenda Luis): cosmos con constelaciones, cabecera de vidrio, saludo en Cinzel, cinta luminosa, tarjetas de vidrio con rombo, barra flotante abajo y riel lateral en computador */
:root{
  --fondo:#040711;--tarjeta:#0b1222;--tarjeta2:rgba(2,6,23,.6);--linea:rgba(255,255,255,.08);--linea2:rgba(255,255,255,.16);
  --texto:#f1f5f9;--texto-suave:rgba(226,232,240,.92);--gris:#94a3b8;
  --acento:#fde08d;--acento-texto:#fde68a;--sobre-acento:#1a1204;--acento-suave:rgba(251,191,36,.12);--acento-borde:rgba(253,224,141,.55);--acento-sombra:rgba(253,224,141,.22);
  --tinta:#22d3ee;--tinta-suave:rgba(34,211,238,.12);--extra:#c084fc;--extra-suave:rgba(192,132,252,.13);--alerta:#fb923c;
  --vidrio:linear-gradient(135deg,rgba(15,23,42,.62) 0%,rgba(9,13,26,.82) 100%);--vidrio-fuerte:rgba(9,13,26,.78);--hondo:rgba(2,6,23,.55);
  --campo-borde:rgba(6,182,212,.3);--boton:linear-gradient(135deg,#fde08d 0%,#f6c86a 100%);
  --activo:linear-gradient(90deg,rgba(6,182,212,.25),rgba(223,159,40,.25));--orbe-mic:radial-gradient(circle at 40% 35%,rgba(253,224,141,.35),rgba(6,182,212,.25) 60%,rgba(9,13,26,.9));
  --titulo:linear-gradient(180deg,#ffffff 0%,#f1f5f9 45%,#a5f3fc 100%);
  --orbe1:rgba(6,182,212,.13);--orbe2:rgba(245,158,11,.11);--orbe3:rgba(147,51,234,.10);
  --p1:#fde08d;--p2:#22d3ee;--p3:#c084fc;--p-linea:rgba(34,211,238,.09);
  --degradado:linear-gradient(135deg,#fde08d,#22d3ee);--sombra:0 20px 50px rgba(0,0,0,.55);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --fondo:#f4efe4;--tarjeta:#fffdf8;--tarjeta2:rgba(255,255,255,.75);--linea:rgba(30,41,59,.10);--linea2:rgba(30,41,59,.18);
  --texto:#1b2333;--texto-suave:#3b4558;--gris:#5f6b7d;
  --acento:#b7791f;--acento-texto:#8a5a12;--sobre-acento:#1a1204;--acento-suave:rgba(183,121,31,.12);--acento-borde:rgba(183,121,31,.45);--acento-sombra:rgba(183,121,31,.18);
  --tinta:#0e7490;--tinta-suave:rgba(14,116,144,.1);--extra:#7e22ce;--extra-suave:rgba(126,34,206,.1);--alerta:#c2410c;
  --vidrio:linear-gradient(135deg,rgba(255,255,255,.78) 0%,rgba(255,252,245,.9) 100%);--vidrio-fuerte:rgba(255,252,245,.85);--hondo:rgba(255,255,255,.7);
  --campo-borde:rgba(14,116,144,.28);--boton:linear-gradient(135deg,#f6d27a 0%,#e9b44c 100%);
  --activo:linear-gradient(90deg,rgba(14,116,144,.14),rgba(183,121,31,.18));--orbe-mic:radial-gradient(circle at 40% 35%,rgba(246,210,122,.9),rgba(14,116,144,.35) 70%);
  --titulo:linear-gradient(180deg,#1b2333 0%,#334155 50%,#0e7490 100%);
  --orbe1:rgba(14,116,144,.12);--orbe2:rgba(217,160,60,.16);--orbe3:rgba(126,34,206,.07);
  --p1:#b7791f;--p2:#0e7490;--p3:#7e22ce;--p-linea:rgba(14,116,144,.10);
  --degradado:linear-gradient(135deg,#e9b44c,#0e7490);--sombra:0 14px 36px rgba(60,45,20,.12);
  color-scheme:light}}
:root[data-theme="light"]{
  --fondo:#f4efe4;--tarjeta:#fffdf8;--tarjeta2:rgba(255,255,255,.75);--linea:rgba(30,41,59,.10);--linea2:rgba(30,41,59,.18);
  --texto:#1b2333;--texto-suave:#3b4558;--gris:#5f6b7d;
  --acento:#b7791f;--acento-texto:#8a5a12;--sobre-acento:#1a1204;--acento-suave:rgba(183,121,31,.12);--acento-borde:rgba(183,121,31,.45);--acento-sombra:rgba(183,121,31,.18);
  --tinta:#0e7490;--tinta-suave:rgba(14,116,144,.1);--extra:#7e22ce;--extra-suave:rgba(126,34,206,.1);--alerta:#c2410c;
  --vidrio:linear-gradient(135deg,rgba(255,255,255,.78) 0%,rgba(255,252,245,.9) 100%);--vidrio-fuerte:rgba(255,252,245,.85);--hondo:rgba(255,255,255,.7);
  --campo-borde:rgba(14,116,144,.28);--boton:linear-gradient(135deg,#f6d27a 0%,#e9b44c 100%);
  --activo:linear-gradient(90deg,rgba(14,116,144,.14),rgba(183,121,31,.18));--orbe-mic:radial-gradient(circle at 40% 35%,rgba(246,210,122,.9),rgba(14,116,144,.35) 70%);
  --titulo:linear-gradient(180deg,#1b2333 0%,#334155 50%,#0e7490 100%);
  --orbe1:rgba(14,116,144,.12);--orbe2:rgba(217,160,60,.16);--orbe3:rgba(126,34,206,.07);
  --p1:#b7791f;--p2:#0e7490;--p3:#7e22ce;--p-linea:rgba(14,116,144,.10);
  --degradado:linear-gradient(135deg,#e9b44c,#0e7490);--sombra:0 14px 36px rgba(60,45,20,.12);
  color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;background:var(--fondo);color:var(--texto);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:rgba(6,182,212,.3)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--tinta)}
#cosmos{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.orbe{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(120px);max-width:90vw;max-height:90vw}
.orbe.o1{top:-90px;left:8%;width:380px;height:380px;background:var(--orbe1)}
.orbe.o2{bottom:30px;right:4%;width:440px;height:440px;background:var(--orbe2)}
.orbe.o3{top:48%;left:50%;width:520px;height:520px;transform:translate(-50%,-50%);background:var(--orbe3)}
.app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding-block:18px 130px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Cabecera */
header{margin-bottom:22px}
.top{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:50;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px 9px 16px;border-radius:20px;
  background:var(--vidrio-fuerte);border:1px solid var(--linea2);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:var(--sombra)}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--tinta)}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip-son{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid var(--linea2);color:var(--texto);font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:999px;min-height:38px;white-space:nowrap}
.chip-son.on{border-color:var(--acento-borde);color:var(--acento-texto)}
.hilo{width:190px;height:1px;margin:26px auto 0;background:linear-gradient(90deg,transparent,var(--acento),transparent);opacity:.8}
h1{text-align:center;font-family:"Cinzel",Georgia,serif;font-weight:700;font-size:clamp(46px,13vw,76px);letter-spacing:.05em;line-height:1.02;margin-top:12px;overflow-wrap:anywhere}
h1 .hero-pre{display:block;font-family:"Plus Jakarta Sans",sans-serif;font-size:12px;font-weight:600;letter-spacing:.38em;text-transform:uppercase;color:var(--acento-texto);margin-bottom:8px}
.marca{background:var(--titulo);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgba(34,211,238,.35))}
.rombo{display:flex;align-items:center;justify-content:center;gap:9px;margin:14px 0 12px}
.rombo span{width:52px;height:1px;background:linear-gradient(90deg,transparent,var(--acento))}
.rombo span:last-child{transform:scaleX(-1)}
.rombo i{width:9px;height:9px;transform:rotate(45deg);border:1px solid var(--acento);background:var(--acento-suave);box-shadow:0 0 12px var(--acento)}
.frase{max-width:560px;margin:0 auto;text-align:center;font-style:italic;font-weight:300;font-size:clamp(15.5px,4vw,19px);line-height:1.6;color:var(--texto-suave);cursor:pointer;padding:0 8px;transition:opacity .4s;quotes:"“" "”"}
.frase::before{content:open-quote}.frase::after{content:close-quote}
.cinta{position:relative;height:58px;margin-top:22px;border-radius:18px;background:var(--hondo);border:1px solid var(--linea);overflow:hidden}
.cinta-base{position:absolute;left:0;right:0;top:30px;height:1px;background:linear-gradient(90deg,transparent,var(--linea2) 8%,var(--linea2) 92%,transparent)}
.cinta-pto{position:absolute;top:14px;width:11px;height:11px;border-radius:50%;transform:translateX(-50%);border:2px solid var(--fondo);background:var(--tinta);box-shadow:0 0 10px var(--tinta);cursor:pointer;padding:0}
.cinta-pto.ok{background:var(--acento);box-shadow:0 0 10px var(--acento)}
.cinta-pto.voz{background:var(--extra);box-shadow:0 0 10px var(--extra)}
.cinta-pto.rep{background:var(--alerta);box-shadow:0 0 10px var(--alerta)}
.cinta-pto.lock{background:var(--linea2);box-shadow:none}
.cinta-h{position:absolute;top:36px;transform:translateX(-50%);font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--gris)}
.cinta-ahora{position:absolute;top:4px;bottom:14px;width:2px;background:var(--acento);box-shadow:0 0 12px var(--acento);transform:translateX(-1px);border-radius:2px}
.cinta-ahora::before{content:"";position:absolute;top:-3px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--acento)}
.proximo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;row-gap:4px;margin-top:12px;padding:13px 16px;border-radius:18px;background:var(--vidrio);border:1px solid var(--linea2);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);font-size:15px;cursor:pointer;text-align:left;width:100%}
.px-eti{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--acento-texto);flex:none}
.px-txt{flex:1 1 140px;min-width:0}
.px-en{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:600;color:var(--tinta);flex:none}

/* Secciones y tarjetas */
section{display:none}
section.visible{display:block}
.tarjeta{background:var(--vidrio);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--linea);border-radius:26px;padding:20px 18px;margin-bottom:16px;box-shadow:var(--sombra);position:relative}
.tarjeta::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 1px 1px rgba(255,255,255,.12)}
.tarjeta h2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:"Cinzel",Georgia,serif;font-size:19px;font-weight:600;letter-spacing:.03em;margin-bottom:14px}
.tarjeta h2::before{content:"";width:8px;height:8px;transform:rotate(45deg);border:1px solid var(--acento);background:var(--acento-suave);box-shadow:0 0 10px var(--acento);flex:none}
.tarjeta h3{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta);margin:16px 0 8px}
.pill{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding:2px 9px;border-radius:20px;background:var(--acento-suave);color:var(--acento-texto);border:1px solid var(--acento-borde)}
.pill.t{background:var(--tinta-suave);color:var(--tinta);border-color:rgba(34,211,238,.4)}
.pill.x{background:var(--extra-suave);color:var(--extra);border-color:rgba(192,132,252,.4)}
.nota{font-size:13.5px;color:var(--gris);line-height:1.55}
.texto{font-size:15.5px;color:var(--texto-suave);line-height:1.55}
.aviso{display:flex;gap:10px;align-items:flex-start;background:var(--acento-suave);border:1px solid var(--acento-borde);border-radius:16px;padding:11px 14px;font-size:14px;line-height:1.5}
.aviso::before{content:"◇";color:var(--acento);flex:none;line-height:1.4}
.aviso.t{background:var(--tinta-suave);border-color:rgba(34,211,238,.35)} .aviso.t::before{color:var(--tinta)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:"Plus Jakarta Sans",sans-serif;border-radius:999px;background:var(--boton);color:var(--sobre-acento);font-weight:700;font-size:15px;padding:12px 22px;min-height:48px;box-shadow:0 0 24px var(--acento-sombra);letter-spacing:.02em;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.chico{min-height:42px;padding:9px 16px;font-size:14px}
.btn.fantasma{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid var(--linea2);color:var(--texto);box-shadow:none}
.btn.fantasma:hover{border-color:var(--tinta);box-shadow:0 0 18px rgba(34,211,238,.25)}
.btn.peligro{background:none;border:1px solid var(--alerta);color:var(--alerta);box-shadow:none}
.btn.peligro.lleno{background:var(--alerta);color:#1a0b04}
.btn:disabled{opacity:.38;cursor:default;box-shadow:none}
.btn.ancho{width:100%}
.fila-btn{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.fila-btn.entre{justify-content:space-between}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--hondo);border:1px solid var(--linea);border-radius:999px;padding:4px}
.seg button{font-size:13.5px;border-radius:999px;padding:9px 15px;color:var(--gris);font-weight:500}
.seg button.sel{background:var(--activo);color:var(--acento-texto);box-shadow:inset 0 0 0 1px var(--acento-borde)}
input[type=text],textarea{font-family:"Plus Jakarta Sans",sans-serif;font-size:16px;background:var(--hondo);border:1px solid var(--campo-borde);border-radius:16px;padding:12px 14px;color:var(--texto);min-height:48px;width:100%}
textarea{border-radius:22px;min-height:96px;line-height:1.5;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--tinta);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
input::placeholder,textarea::placeholder{color:var(--gris);opacity:.7}
input[type=range]{accent-color:var(--acento);width:100%}
.progreso-linea{height:8px;border-radius:999px;background:var(--hondo);overflow:hidden}
.progreso-linea>div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--tinta),var(--acento));box-shadow:0 0 12px var(--acento-sombra);transition:width .8s}
.racha-num{font-family:"Cinzel",Georgia,serif;font-size:38px;line-height:1;background:linear-gradient(180deg,#fff,var(--acento));-webkit-background-clip:text;background-clip:text;color:transparent}
.racha{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:6px}
.racha div span{display:block;font-size:12.5px;color:var(--gris);margin-top:4px}

/* Lista de módulos (tipo agenda) */
.tl-item{display:flex;align-items:center;gap:13px;padding:13px 2px;border-bottom:1px solid var(--linea);width:100%;text-align:left}
.tl-item:last-child{border-bottom:0}
.tl-hora{font-family:"JetBrains Mono",monospace;font-size:14px;font-weight:600;width:30px;color:var(--tinta);flex:none}
.tl-cuerpo{flex:1;min-width:0}
.tl-texto{font-size:16px;font-weight:500;display:block}
.tl-sub{font-size:13px;color:var(--gris);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:3px}
.tl-tipo{font-family:"JetBrains Mono",monospace;font-size:10.5px;padding:2px 9px;border-radius:20px;border:1px solid currentColor;letter-spacing:.06em}
.tl-tipo.voz{color:var(--extra);background:rgba(192,132,252,.1)}
.tl-tipo.esp{color:var(--tinta);background:rgba(34,211,238,.1)}
.tl-check{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--linea2);flex:none;display:grid;place-items:center;color:var(--sobre-acento)}
.tl-check svg{width:15px;height:15px}
.tl-item.hecho .tl-check{background:var(--boton);border-color:transparent;box-shadow:0 0 14px var(--acento-sombra)}
.tl-item.rep .tl-check{border-color:var(--alerta)}
.tl-item.lock{opacity:.5;cursor:default}
.tl-item.cur{background:linear-gradient(90deg,var(--acento-suave),transparent);border-radius:14px;padding-inline:10px}

/* Práctica */
.pasos{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.pasos span{font-size:12.5px;border-radius:999px;padding:6px 12px;border:1px solid var(--linea);color:var(--gris);background:var(--hondo)}
.pasos span.on{background:var(--activo);border-color:var(--acento-borde);color:var(--acento-texto)}
.pasos span.ok{color:var(--tinta);border-color:rgba(34,211,238,.35)}
.opc{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--hondo);border:1px solid var(--linea);border-radius:20px;padding:14px;margin-top:10px;transition:border-color .2s,box-shadow .2s}
.opc:hover:not(:disabled){border-color:var(--acento-borde)}
.opc .k{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--linea2);display:grid;place-items:center;font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--acento-texto)}
.opc.bien{border-color:var(--acento-borde);background:var(--acento-suave);box-shadow:0 0 26px var(--acento-sombra)}
.opc.bien .k{background:var(--boton);color:var(--sobre-acento);border-color:transparent}
.opc.mal{border-color:var(--alerta)}
.opc.mal .k{border-color:var(--alerta);color:var(--alerta)}
.opc .ver{display:block;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:3px}
.opc.bien .ver{color:var(--acento-texto)} .opc.mal .ver{color:var(--alerta)}
.opc:disabled{cursor:default}
.instr{background:var(--hondo);border:1px solid var(--campo-borde);border-radius:22px;padding:14px 16px;white-space:pre-wrap;font-size:15.5px;line-height:1.55}
.instr.voz{border-color:rgba(192,132,252,.45)}
.ias{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ia{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--linea2);background:var(--hondo);border-radius:999px;padding:9px 15px;font-size:14px;font-weight:600;text-decoration:none;color:var(--texto)}
.ia i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.ia.sel{background:var(--activo);border-color:var(--acento-borde);color:var(--acento-texto);box-shadow:0 0 18px var(--acento-sombra)}
.ia small{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.12em;color:var(--extra)}
.paso-n{display:flex;gap:12px;margin-top:16px}
.paso-n>b{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--tinta);color:var(--tinta);display:grid;place-items:center;font-family:"JetBrains Mono",monospace;font-size:12px}
.paso-n.ok>b{background:var(--boton);border-color:transparent;color:var(--sobre-acento)}
.paso-n>div{flex:1;min-width:0}
.paso-n h4{font-family:"Cinzel",Georgia,serif;font-size:16px;font-weight:600;margin-bottom:6px}
.chk{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 2px;border-bottom:1px solid var(--linea);font-size:15.5px}
.chk:last-child{border-bottom:0}
.chk .tl-check{transition:all .25s cubic-bezier(.2,.9,.3,1.4)}
.chk .tl-check svg{opacity:0}
.chk[aria-pressed="true"] .tl-check{background:var(--boton);border-color:transparent;box-shadow:0 0 14px var(--acento-sombra);transform:scale(1.08)}
.chk[aria-pressed="true"] .tl-check svg{opacity:1}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.cmp{grid-template-columns:1fr}}
.res{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.anillo{width:120px;height:120px;position:relative;flex:none}
.anillo svg{width:100%;height:100%;transform:rotate(-90deg)}
.anillo .v{stroke-dasharray:295.3;stroke-dashoffset:var(--off);animation:anl 1.3s cubic-bezier(.2,.9,.3,1) both;filter:drop-shadow(0 0 5px var(--acento-sombra))}
@keyframes anl{from{stroke-dashoffset:295.3}}
.anillo b{position:absolute;inset:0;display:grid;place-items:center;font-family:"Cinzel",Georgia,serif;font-size:30px;font-weight:700}

/* Voz */
.voz-caja{display:flex;gap:12px;align-items:stretch}
.voz-caja textarea{flex:1}
.mic{flex:none;width:70px;border-radius:24px;background:var(--orbe-mic);border:1px solid var(--acento-borde);font-size:26px;box-shadow:0 0 30px rgba(34,211,238,.3),inset 0 0 18px rgba(253,224,141,.15);display:grid;place-items:center;color:var(--texto)}
.mic svg{width:28px;height:28px}
.mic.on{background:#E03131;color:#fff;animation:latir 1.2s ease-in-out infinite}
@keyframes latir{50%{box-shadow:0 0 0 8px rgba(224,49,49,.2)}}
.grab-fila{display:flex;align-items:center;gap:16px}
.grab-btn{flex:none;width:84px;height:84px;border-radius:50%;color:var(--texto);border:1px solid var(--acento-borde);background:var(--orbe-mic);box-shadow:0 0 30px rgba(34,211,238,.3),inset 0 0 18px rgba(253,224,141,.15);display:grid;place-items:center;transition:transform .1s}
.grab-btn svg{width:32px;height:32px}
.grab-btn:active{transform:scale(.95)}
.grab-btn.on{background:#E03131;color:#fff;animation:latir 1.2s ease-in-out infinite}
.vu{display:flex;gap:4px;align-items:flex-end;height:64px;flex:1;min-width:0}
.vu i{flex:1;height:12%;border-radius:4px;background:var(--linea2);transition:height .07s,background .2s}
.vu i.a{background:linear-gradient(180deg,var(--acento),var(--tinta));box-shadow:0 0 10px rgba(34,211,238,.4)}
.lectura{display:flex;gap:16px;flex-wrap:wrap;font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--gris);margin-top:12px}
.lectura b{color:var(--tinta);font-weight:600}
.est{font-size:14px;font-weight:600;margin-top:8px}
.est.ok{color:var(--tinta)} .est.bajo,.est.alto{color:var(--alerta)}
.vlista .tl-item{cursor:default}

/* Música y pausa */
.amb-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.amb-grid button{background:var(--hondo);border:1px solid var(--linea);border-radius:20px;padding:13px 4px;font-size:13.5px;font-weight:600;min-height:74px;display:flex;flex-direction:column;align-items:center;gap:4px}
.amb-grid button span{font-size:22px;line-height:1}
.amb-grid button.on{background:var(--activo);border-color:var(--acento-borde);color:var(--acento-texto);box-shadow:0 0 25px var(--acento-sombra)}
@media (max-width:430px){.amb-grid{grid-template-columns:repeat(2,1fr)}}
.amb-ctrl{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:13px;color:var(--gris)}
.amb-estado{font-size:12.5px;color:var(--tinta);font-weight:600;margin-top:8px;min-height:1em}
.pausa-ops{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pausa-ops .btn{width:100%}
.pausa{position:fixed;inset:0;z-index:140;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center;background:radial-gradient(circle at 50% 42%,rgba(34,211,238,.16),rgba(34,211,238,0) 60%),#040711;color:#f1f5f9}
.pausa.ver{display:flex}
.pausa-eti{font-size:11.5px;letter-spacing:.38em;text-transform:uppercase;color:#fde08d;font-weight:600}
.resp-caja{position:relative;width:min(74vw,340px);aspect-ratio:1;max-width:100%;display:flex;align-items:center;justify-content:center}
.resp-anillo{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.resp-anillo circle{fill:none;stroke-width:1.6}
.ra-fondo{stroke:rgba(255,255,255,.08)}
.ra-prog{stroke:#fde08d;stroke-linecap:round;filter:drop-shadow(0 0 4px rgba(253,224,141,.8));stroke-dasharray:295.3}
.pausa[data-fase="0"] .ra-prog{stroke:#22d3ee;filter:drop-shadow(0 0 4px rgba(34,211,238,.8))}
.pausa[data-fase="2"] .ra-prog{stroke:#c084fc;filter:drop-shadow(0 0 4px rgba(192,132,252,.8))}
.resp-centro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;pointer-events:none}
.pausa-fase{font-family:"Cinzel",Georgia,serif;font-size:clamp(24px,7vw,34px);letter-spacing:.08em;color:#fff;text-transform:uppercase;text-shadow:0 0 18px rgba(4,7,17,.9)}
.resp-seg{font-family:"JetBrains Mono",monospace;font-size:clamp(30px,9vw,44px);font-weight:600;color:#fff;text-shadow:0 0 16px rgba(34,211,238,.8);min-height:1.1em}
.orbe-resp{width:86%;aspect-ratio:1;border-radius:50%;transform:scale(.55);transition:transform 4s ease-in-out;
  background:radial-gradient(circle at 42% 36%,rgba(253,224,141,.6),rgba(34,211,238,.28) 52%,rgba(168,85,247,.14) 72%,rgba(4,7,17,0) 74%);border:1px solid rgba(253,224,141,.45);box-shadow:0 0 80px rgba(34,211,238,.45),inset 0 0 50px rgba(253,224,141,.25)}
.resp-guia{max-width:440px;font-style:italic;font-weight:300;font-size:clamp(15px,4vw,18px);line-height:1.55;color:rgba(226,232,240,.9);min-height:3.1em}
.pausa-tiempo{font-family:"JetBrains Mono",monospace;color:#22d3ee;letter-spacing:.06em;font-size:13.5px}
.pausa .btn.fantasma{color:#f1f5f9;border-color:rgba(255,255,255,.2)}

/* Navegación flotante */
nav{position:fixed;z-index:60;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;padding:6px;display:flex;gap:4px;
  border:1px solid var(--linea2);border-radius:26px;background:var(--vidrio-fuerte);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 18px 40px rgba(0,0,0,.45)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;padding:8px 2px 7px;border-radius:20px;border:1px solid transparent;color:var(--gris);min-height:56px}
nav button svg{width:22px;height:22px}
nav button.activa{background:var(--activo);border-color:var(--acento-borde);color:var(--acento-texto);box-shadow:0 0 22px var(--acento-sombra)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:90;background:#0f172a;color:#f1f5f9;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:11px 20px;font-size:14px;box-shadow:0 0 30px rgba(34,211,238,.2);max-width:calc(100vw - 32px);text-align:center}
.tw{overflow-x:auto}
.confirm{display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center}
.reg{max-width:520px;margin:0 auto}
.seg.grande button{padding:11px 16px;font-size:14px}

@media (min-width:1024px){
  .app{max-width:1200px;padding:24px 36px 48px 140px}
  nav{left:22px;right:auto;top:50%;bottom:auto;transform:translateY(-50%);flex-direction:column;width:92px;max-width:none;margin:0;padding:10px;gap:8px;border-radius:30px}
  nav button{flex:none;min-height:70px;font-size:12px}
  nav button svg{width:24px;height:24px}
  .top{top:16px}
  h1{font-size:84px}
  section.visible{column-count:2;column-gap:22px}
  section .tarjeta{break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid}
  section .ancha{column-span:all;-webkit-column-span:all}
  .toast{bottom:28px}
}
@media (max-width:430px){
  .app{padding-block:12px 124px}
  .tarjeta{padding:18px 15px;border-radius:24px}
  .top{padding:8px 8px 8px 14px}
  .eyebrow{font-size:10px;letter-spacing:.16em}
  .chip-son{font-size:11.5px;padding:7px 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const AU={ctx:null,master:null,cur:null,nombre:null,duck:false,
  init(){if(this.ctx)return true;const A=window.AudioContext||window.webkitAudioContext;if(!A)return false;this.ctx=new A();this.master=this.ctx.createGain();this.master.gain.value=0;this.master.connect(this.ctx.destination);return true;},

  ruido(tipo){const c=this.ctx,len=c.sampleRate*4,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);let last=0;
    for(let i=0;i<len;i++){const w=Math.random()*2-1;if(tipo==="marron"){last=(last+.02*w)/1.02;d[i]=last*3.2;}else d[i]=w*.5;}
    const s=c.createBufferSource();s.buffer=b;s.loop=true;return s;},
  sonar(nombre){if(!this.init())return false;try{this.ctx.resume();}catch(e){}this.parar(true);const c=this.ctx,out=c.createGain();out.gain.value=1;out.connect(this.master);const nodos=[];let timer=null;
    const dl=c.createDelay(2);dl.delayTime.value=.45;const fb=c.createGain();fb.gain.value=.4;const lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2200;dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(out);
    const campana=(sc,a)=>{const n=c.currentTime,f=sc[Math.floor(Math.random()*sc.length)];[[f,a],[f*2.01,a*.25],[f*3.02,a*.1]].forEach(([fr,g])=>{const o=c.createOscillator(),e=c.createGain();o.frequency.value=fr;
      e.gain.setValueAtTime(.0001,n);e.gain.exponentialRampToValueAtTime(g,n+.03);e.gain.exponentialRampToValueAtTime(.0001,n+5);o.connect(e);e.connect(out);e.connect(dl);o.start(n);o.stop(n+5.1);});};
    if(nombre==="cuencos"){[110,164.81,220,277.18].forEach((f,i)=>{const o=c.createOscillator();o.type=i%2?"triangle":"sine";o.frequency.value=f;o.detune.value=(i-1.5)*5;const pf=c.createBiquadFilter();pf.type="lowpass";pf.frequency.value=700;
        const g=c.createGain();g.gain.value=.05/(1+i*.5);const l=c.createOscillator();l.frequency.value=.04+i*.025;const lg=c.createGain();lg.gain.value=.028/(1+i*.5);l.connect(lg);lg.connect(g.gain);o.connect(pf);pf.connect(g);g.connect(out);g.connect(dl);o.start();l.start();nodos.push(o,l);});
      const loop=()=>{campana([440,493.88,554.37,659.25,739.99,880],.07);timer=setTimeout(loop,3500+Math.random()*5500);};timer=setTimeout(loop,800);}
    if(nombre==="lluvia"){const s=this.ruido("blanco"),hp=c.createBiquadFilter();hp.type="highpass";hp.frequency.value=900;const lp2=c.createBiquadFilter();lp2.type="lowpass";lp2.frequency.value=7000;const g=c.createGain();g.gain.value=.22;
      s.connect(hp);hp.connect(lp2);lp2.connect(g);g.connect(out);s.start();nodos.push(s);
      const gota=()=>{const n=c.currentTime,o=c.createOscillator(),e=c.createGain();o.frequency.setValueAtTime(1800+Math.random()*1600,n);o.frequency.exponentialRampToValueAtTime(500,n+.08);e.gain.setValueAtTime(.025,n);e.gain.exponentialRampToValueAtTime(.0001,n+.1);o.connect(e);e.connect(out);o.start(n);o.stop(n+.12);timer=setTimeout(gota,80+Math.random()*400);};timer=setTimeout(gota,300);}
    if(nombre==="mar"){const s=this.ruido("marron"),lp3=c.createBiquadFilter();lp3.type="lowpass";lp3.frequency.value=650;const g=c.createGain();g.gain.value=.25;const l=c.createOscillator();l.frequency.value=.085;const lg=c.createGain();lg.gain.value=.2;l.connect(lg);lg.connect(g.gain);
      s.connect(lp3);lp3.connect(g);g.connect(out);s.start();l.start();nodos.push(s,l);}
    if(nombre==="cristal"){[220,329.63].forEach(f=>{const o=c.createOscillator();o.frequency.value=f;const g=c.createGain();g.gain.value=.025;o.connect(g);g.connect(out);g.connect(dl);o.start();nodos.push(o);});
      const loop=()=>{campana([523.25,659.25,783.99,987.77,1046.5],.045);timer=setTimeout(loop,1800+Math.random()*2600);};timer=setTimeout(loop,400);}
    this.cur={out,nodos,stop:()=>{clearTimeout(timer);const n=c.currentTime;out.gain.setValueAtTime(out.gain.value,n);out.gain.linearRampToValueAtTime(0,n+1.2);setTimeout(()=>{nodos.forEach(x=>{try{x.stop();}catch(e){}});out.disconnect();},1400);}};

  parar(rapido){if(this.cur){this.cur.stop();this.cur=null;}this.nombre=null;if(!rapido)this.rampa(1);},

const MIC={stream:null,ctx:null,an:null,raf:0,pico:-90,
  async iniciar(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return "sin-soporte";
    try{this.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});}catch(e){return e&&e.name||"error";}
    const A=window.AudioContext||window.webkitAudioContext;this.ctx=new A();const src=this.ctx.createMediaStreamSource(this.stream);this.an=this.ctx.createAnalyser();this.an.fftSize=1024;src.connect(this.an);this.pico=-90;AU.silenciar(true);this.loop();return null;},
  loop(){const buf=new Float32Array(this.an.fftSize),bars=document.querySelectorAll("#vu i");
    const f=()=>{if(!this.an)return;this.an.getFloatTimeDomainData(buf);let s=0;for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i];const db=Math.max(-90,20*Math.log10(Math.sqrt(s/buf.length)+1e-9));this.pico=Math.max(this.pico-.4,db);
      const lv=Math.min(1,Math.max(0,(db+60)/60));bars.forEach((b,i)=>{const pos=Math.abs(i-(bars.length-1)/2)/(bars.length/2);const h=Math.max(.12,Math.min(1,lv*1.35-pos*.55+Math.random()*.08));b.style.height=(h*100)+"%";b.className=lv>.12?"a":"";});
      const q=id=>document.getElementById(id);if(q("mdb"))q("mdb").textContent=db.toFixed(1)+" dB";if(q("mpk"))q("mpk").textContent=this.pico.toFixed(1)+" dB";
      if(q("mest")){const e=db<-50?["bajo","Aún no se escucha tu voz. Acércate o habla un poco más fuerte."]:db>-8?["alto","Muy fuerte: aléjate un poco."]:["ok","Te escucho bien."];q("mest").className="est "+e[0];q("mest").textContent=e[1];}
      this.raf=requestAnimationFrame(f);};f();},
  parar(){cancelAnimationFrame(this.raf);if(this.stream)this.stream.getTracks().forEach(t=>t.stop());this.stream=null;if(this.ctx)try{this.ctx.close();}catch(e){}this.ctx=null;this.an=null;AU.silenciar(!!DIC.rec);},
  get activo(){return !!this.an;}
};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const DIC={rec:null,base:"",campo:null,
  iniciar(campoId){if(!SR)return "sin-soporte";const el=document.getElementById(campoId);this.campo=campoId;this.base=el?el.value:"";if(this.base&&!/\s$/.test(this.base))this.base+=" ";

      <div class="fila-btn entre"><button class="btn fantasma chico" data-paso="0">Atrás</button><button class="btn" data-paso="2" ${listo?"":"disabled"}>Ya tengo la respuesta</button></div></div></section>`;}
  if(paso===2){const n=m.mir?2:1;
    return `<section class="visible">${cab}<p class="nota">${m.mir?"Pega o resume las dos respuestas para mirarlas lado a lado.":"Si quieres, pega la respuesta para mirarla con calma."} Esto no se guarda.</p>

    <div style="flex:1;min-width:200px"><p class="texto">${R.ok?"Bien hecho. Volverá en unos días para repasar.":"Mañana te la mostraré de nuevo para repasarla."}</p>${R.lv?`<p style="margin-top:8px"><span class="pill">Se abrió el nivel ${R.lv}</span></p>`:""}</div></div>

      <span class="confirm"><button class="btn fantasma chico" data-mod="${m.id}">Repetir</button>${conf("res:"+m.id,"Borrar")}</span></div>`;}).join("")+`<p class="nota" style="margin-top:8px">«Repetir» reemplaza el resultado. «Borrar» deja la práctica como nueva.</p>`:`<p class="nota">Aún no hay prácticas registradas.</p>`}</div>

function pintar(){
  if(sec!=="voz"&&MIC.activo)MIC.parar();
  $("#cab").innerHTML=vCab();
  const nav=$("#nav");nav.hidden=!S.perfil;nav.innerHTML=S.perfil?vNav():"";
  let h;if(!S.perfil)h=vRegistro();else h=sec==="ruta"?vRuta():sec==="practica"?vPractica():sec==="voz"?vVoz():sec==="avance"?vAvance():sec==="ajustes"?vAjustes():(sec="hoy",vHoy());
  $("#main").innerHTML=h;
}
function ir(fn){fn();pintar();window.scrollTo({top:0,behavior:quieto?"auto":"smooth"});}
function selTexto(el){if(!el)return;if(el.select)el.select();toast("Texto seleccionado: cópialo con el menú.");}

/* ================= Eventos ================= */
document.addEventListener("input",e=>{const id=e.target.id;
  if(id==="rnom")reg.nombre=e.target.value;if(id==="enom")d.enom=e.target.value;if(id==="dhoy"||id==="dvoz"){d.dict=e.target.value;DIC.base=e.target.value;}
  if(id==="vol")AU.vol(parseFloat(e.target.value));if(id&&/^r\d$/.test(id)){d.resp=d.resp||[];d.resp[+id.slice(1)]=e.target.value;}});
document.addEventListener("change",e=>{if(e.target.id==="vol")guardar();});
document.addEventListener("click",async e=>{
  const ia=e.target.closest("a[data-ia]");if(ia){const m=M.find(x=>x.id===cur);let a=d.apps||[];if(!a.includes(ia.dataset.ia)){a.push(ia.dataset.ia);if(a.length>(m.mir?2:1))a.shift();}d.apps=a;setTimeout(pintar,60);return;}
  const b=e.target.closest("button,blockquote");if(!b||b.disabled)return;const act=b.dataset.act;
  if(act==="frase"){b.style.opacity=0;setTimeout(()=>{frase=(frase+1)%FRASES.length;b.textContent=FRASES[frase];b.style.opacity=1;},400);return;}
  if(act==="tema"||act==="tema-fijo"){const t=act==="tema"?(oscuro()?"light":"dark"):b.dataset.t;document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("epr-tema",t);}catch(er){}Cosmos.recolor();pintar();return;}
  if(act==="amb-chip"){if(AU.nombre){AU.parar();}else if(!AU.sonar(S.amb||"cuencos")){toast("Este navegador no permite reproducir audio.");return;}pintar();return;}
  if(b.dataset.amb){const k=b.dataset.amb;if(AU.nombre===k)AU.parar();else{AU.sonar(k);S.amb=k;guardar();}pintar();return;}
  if(b.dataset.exp){reg.exp=+b.dataset.exp;b.parentNode.querySelectorAll("button").forEach(x=>x.classList.toggle("sel",x===b));return;}
  if(act==="registrar"){const n=(reg.nombre||"").trim();if(!n){toast("Escribe tu nombre.");$("#rnom").focus();return;}if(reg.exp===null){toast("Elige cuánto has usado una IA.");return;}
    S.perfil={nombre:n,nivel:EXP[reg.exp][1],inicio:Date.now()};guardar();ir(()=>sec="hoy");return;}
  if(b.dataset.sec){pedir=null;ir(()=>sec=b.dataset.sec);return;}
  if(b.dataset.mod){const m=M.find(x=>x.id===b.dataset.mod);if(!abierto(S,m.lv)){toast("Se abre al completar 4 de 5 prácticas del nivel anterior.");return;}
    cur=m.id;paso=0;d={orden:Math.random()<.5?["good","bad"]:["bad","good"],dict:d.dict};ir(()=>sec="practica");return;}
  if(b.dataset.quiz!==undefined){d.quiz=+b.dataset.quiz;AU.tono(d.orden[d.quiz]==="good"?659.25:293.66,.9,.05);pintar();return;}
  if(b.dataset.paso){ir(()=>paso=+b.dataset.paso);return;}
  if(act==="copiar"){const t=M.find(x=>x.id===cur).p;try{navigator.clipboard.writeText(t).then(()=>{d.copiado=true;pintar();toast("Copiado.");},()=>toast("No se pudo copiar: selecciona el texto y cópialo."));}catch(er){toast("Selecciona el texto y cópialo.");}return;}
  if(b.dataset.ck!==undefined){d.ck=d.ck||[];const i=+b.dataset.ck;d.ck[i]=!d.ck[i];b.setAttribute("aria-pressed",String(!!d.ck[i]));if(d.ck[i])AU.tono([523.25,587.33,659.25,783.99][d.ck.filter(Boolean).length-1]||783.99,.8,.05);return;}
  if(act==="registrar-res"){const antes=[abierto(S,2),abierto(S,3)],score=(d.ck||[]).filter(Boolean).length,okk=score>=3,prev=S.res[cur];
    const ra=okk?((prev&&prev.ok?prev.racha||0:0)+1):0,gap=okk?[2,5,10][Math.min(ra-1,2)]:1;
    S.res[cur]={score,ok:okk,apps:d.apps||[],fecha:Date.now(),intentos:(prev?prev.intentos||0:0)+1,racha:ra,repaso:(okk&&ra>3)?0:Date.now()+gap*DAY};
    S.dias=[...new Set([...(S.dias||[]),dk(Date.now())])].slice(-180);guardar();
    ultimo={score,ok:okk,lv:[2,3].find((l,i)=>!antes[i]&&abierto(S,l))||0};if(okk){AU.tono(523.25,2,.06);setTimeout(()=>AU.tono(783.99,2.4,.05),180);}ir(()=>paso=4);return;}
  if(act==="pausa"){PAUSA.abrir(+b.dataset.min);return;}
  if(act==="pausa-fin"){PAUSA.cerrar(false);return;}
  if(act==="dictar"){if(DIC.rec){DIC.parar();return;}const er=DIC.iniciar(b.dataset.campo);if(er){toast(er==="sin-soporte"?"Este navegador no tiene dictado. Usa el micrófono del teclado.":"No se pudo iniciar el dictado.");return;}
    S.voz=S.voz||{};S.voz.dict=(S.voz.dict||0)+1;guardar();b.classList.add("on");b.innerHTML=SVG.stop;b.setAttribute("aria-label","Detener dictado");return;}
  if(act==="copiar-dict"){const el=document.getElementById(b.dataset.campo),t=el?el.value:"";if(!t.trim()){toast("Aún no hay texto.");return;}try{navigator.clipboard.writeText(t).then(()=>toast("Copiado. Pégalo en la IA."),()=>selTexto(el));}catch(er){selTexto(el);}return;}
  if(act==="limpiar-dict"){d.dict="";DIC.base="";const el=$("#dvoz");if(el)el.value="";return;}
  if(act==="mic-iniciar"){const er=await MIC.iniciar();if(er){const m=$("#mmsg");if(m){m.style.color="var(--alerta)";m.textContent=er==="NotAllowedError"||er==="SecurityError"?"El micrófono está bloqueado aquí. Dentro de claude.ai no se puede usar: ábrelo en lc1733.github.io/metodo-espejo/presencia/ o revisa los permisos del navegador.":er==="sin-soporte"?"Este navegador no permite usar el micrófono.":"No se pudo activar el micrófono ("+er+").";}return;}
    S.voz=S.voz||{};S.voz.mic=(S.voz.mic||0)+1;guardar();b.classList.add("on");b.dataset.act="mic-parar";b.innerHTML=SVG.stop;b.setAttribute("aria-label","Detener");return;}
  if(act==="mic-parar"){MIC.parar();pintar();return;}
  if(b.dataset.pedir!==undefined){pedir=b.dataset.pedir||null;pintar();return;}
  if(b.dataset.hacer){const k=b.dataset.hacer;pedir=null;
    if(k==="todo"){S={perfil:null,res:{},dias:[],voz:{mic:0,dict:0},amb:S.amb,vol:S.vol,actualizado:0};d={};reg={nombre:"",exp:null};try{localStorage.removeItem(KEY);}catch(er){}if(docRef){const r=docRef;cola=cola.then(()=>r.delete()).catch(()=>{});}ir(()=>sec="hoy");toast("Avance borrado.");return;}
    if(k.startsWith("res:")){delete S.res[k.slice(4)];guardar();pintar();toast("Práctica borrada.");return;}
    if(k.startsWith("fam:")&&dbRef){dbRef.collection("progreso").doc(k.slice(4)).delete().then(()=>toast("Quitado."),()=>toast("No se pudo quitar."));pintar();return;}
    pintar();return;}
  if(b.dataset.nivel){S.perfil.nivel=+b.dataset.nivel;guardar();pintar();toast("Nivel actualizado.");return;}
  if(act==="guardar-nombre"){const n=(d.enom??S.perfil.nombre).trim();if(!n){toast("El nombre no puede quedar vacío.");return;}S.perfil.nombre=n;delete d.enom;guardar();pintar();toast("Nombre guardado.");return;}
});

/* ================= Cosmos de fondo (partículas y constelaciones) ================= */
const Cosmos=(function(){
  const c=document.getElementById("cosmos");if(!c||!c.getContext)return {recolor(){}};
  const x=c.getContext("2d");let W=0,H=0,pts=[],col=null,ult=0,raf=null;
  const colores=()=>{const s=getComputedStyle(document.documentElement);return [s.getPropertyValue("--p1").trim()||"#fde08d",s.getPropertyValue("--p2").trim()||"#22d3ee",s.getPropertyValue("--p3").trim()||"#c084fc",s.getPropertyValue("--p-linea").trim()||"rgba(34,211,238,.08)"];};
  function tam(){const dpr=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);x.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.round(Math.max(28,Math.min(95,W*H/13000)));pts=[];for(let i=0;i<n;i++)pts.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.35,vx:(Math.random()-.5)*.14,vy:-(Math.random()*.16+.03),f:Math.random()*6.28,k:Math.random()<.45?0:(Math.random()<.7?1:2)});dibujar(performance.now());}
  function dibujar(t){if(!col)col=colores();x.clearRect(0,0,W,H);const lim=95*95;x.lineWidth=.6;x.strokeStyle=col[3];
    for(let i=0;i<pts.length;i++){const p=pts[i];for(let j=i+1;j<pts.length;j++){const q=pts[j],dx=p.x-q.x,dy=p.y-q.y,d2=dx*dx+dy*dy;if(d2<lim){x.globalAlpha=1-d2/lim;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke();}}}
    for(const p of pts){if(!quieto){p.x+=p.vx;p.y+=p.vy;if(p.y<-4){p.y=H+4;p.x=Math.random()*W;}if(p.x<-4)p.x=W+4;else if(p.x>W+4)p.x=-4;}x.globalAlpha=.35+.4*Math.sin(t/1500+p.f);x.fillStyle=col[p.k];x.beginPath();x.arc(p.x,p.y,p.r,0,6.2832);x.fill();}
    x.globalAlpha=1;}
  function bucle(t){if(t-ult>40){ult=t;dibujar(t);}raf=requestAnimationFrame(bucle);}
  function andar(){if(!quieto&&!raf&&!document.hidden)raf=requestAnimationFrame(bucle);}
  function parar(){if(raf){cancelAnimationFrame(raf);raf=null;}}
  window.addEventListener("resize",()=>{clearTimeout(tam.t);tam.t=setTimeout(tam,150);});
  document.addEventListener("visibilitychange",()=>{if(document.hidden)parar();else andar();});
  tam();andar();
  return {recolor(){col=null;if(quieto)dibujar(performance.now());}};
})();
