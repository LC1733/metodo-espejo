<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<title>Espejo Profesional</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Concepto: tablero de formación nocturno, misma familia que Translog Diario — barra de estado arriba, franja de KPIs, pestañas con subrayado naranja, tablas densas y laboratorio de voz con vúmetro */
:root{
  --bg:#0E1116; --panel:#161B22; --panel2:#1C232D; --line:#2A323D;
  --fg:#E8ECF1; --muted:#8C97A6; --accent:#F47A20; --accent-ink:#1A0D02; --accent-soft:rgba(244,122,32,.14);
  --ok:#3FB98A; --warn:#E3B341; --bad:#F0605D; --c2:#5AA9E6; --c3:#A98BE8; --grid:rgba(140,151,166,.18);
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F4F5F7; --panel:#FFFFFF; --panel2:#F0F2F5; --line:#DCE0E6;
  --fg:#141920; --muted:#5B6676; --accent:#D9650F; --accent-ink:#FFFFFF; --accent-soft:rgba(217,101,15,.10);
  --ok:#1E8E62; --warn:#A6750B; --bad:#C93C39; --c2:#2F7FC1; --c3:#7357C7; --grid:rgba(91,102,118,.16);
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F4F5F7; --panel:#FFFFFF; --panel2:#F0F2F5; --line:#DCE0E6;
  --fg:#141920; --muted:#5B6676; --accent:#D9650F; --accent-ink:#FFFFFF; --accent-soft:rgba(217,101,15,.10);
  --ok:#1E8E62; --warn:#A6750B; --bad:#C93C39; --c2:#2F7FC1; --c3:#7357C7; --grid:rgba(91,102,118,.16);
  color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.5}
.tl{max-width:1180px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(26px,3.4vw,36px);line-height:1.05}
h2{font-size:20px} h3{font-size:16px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.mono{font-family:var(--f-mono);font-size:12px}
button{font:inherit;color:inherit}
a{color:var(--c2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--accent);font-weight:600}

/* Encabezado */
.head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
.head .sub{color:var(--muted);font-size:13.5px;margin-top:4px;max-width:62ch}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.ibtn{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:13px;min-height:38px}
.ibtn svg{width:16px;height:16px;flex:none}
.ibtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.zen{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 4px}
.zen .ibtn{border:0;background:transparent;min-height:30px;padding:4px 8px}
.zen input[type=range]{width:90px;accent-color:var(--accent)}
.eq{display:inline-flex;gap:2px;align-items:end;height:12px}
.eq i{width:2px;background:currentColor;border-radius:1px;height:30%}
.zen.on .eq i{animation:eq 1.6s ease-in-out infinite}
.zen.on .eq i:nth-child(2){animation-delay:.3s} .zen.on .eq i:nth-child(3){animation-delay:.7s} .zen.on .eq i:nth-child(4){animation-delay:1.1s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--panel);padding:14px 16px;display:grid;gap:2px;align-content:start;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-family:var(--f-display);font-weight:500}
.kpi .v{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,2.3vw,30px);font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap}
.kpi .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.kpi.hl .v{color:var(--accent)}
.mini{height:4px;border-radius:2px;background:var(--panel2);overflow:hidden;margin-top:6px}
.mini i{display:block;height:100%;background:var(--accent);transform-origin:left;animation:grow .9s cubic-bezier(.2,.9,.3,1) both}
@keyframes grow{from{transform:scaleX(0)}}

/* Pestañas */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;color:var(--muted);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:var(--f-display);font-size:15px;font-weight:600;letter-spacing:.02em}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin-left:6px;color:var(--muted)}
.page{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-content:start;min-width:0}
.card .note{font-size:13px;color:var(--muted);line-height:1.45;max-width:75ch}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lead{background:linear-gradient(180deg,var(--accent-soft),transparent 70%),var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;padding:16px;display:grid;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:40px}
.btn svg{width:15px;height:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.sm{padding:6px 11px;min-height:32px;font-size:13px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 50%,transparent)}
.btn.danger.solid{background:var(--bad);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.pill.ok::before{background:var(--ok)} .pill.warn::before{background:var(--warn)} .pill.bad::before{background:var(--bad)} .pill.c2::before{background:var(--c2)}
.tag{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:1px 8px;color:var(--muted);white-space:nowrap}
.tag.voz{color:var(--c3);border-color:color-mix(in srgb,var(--c3) 45%,transparent)}
.tag.esp{color:var(--c2);border-color:color-mix(in srgb,var(--c2) 45%,transparent)}

/* Lista de módulos */
.mods{display:grid;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mod{display:grid;grid-template-columns:40px minmax(0,1fr) 150px 120px 70px 96px;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);background:var(--panel)}
.mod:first-child{border-top:0}
.mod.hd{background:var(--panel2);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600;padding-block:8px}
.mod .num{font-family:var(--f-mono);color:var(--muted);font-size:12px}
.mod .t b{display:block;font-weight:600}
.mod .t span{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.mod .sc{font-family:var(--f-mono);font-size:13px;text-align:right}
.mod.locked{opacity:.55}
.mod.cur{background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
@media (max-width:760px){.mod{grid-template-columns:32px minmax(0,1fr) auto}.mod .cp,.mod .sc,.mod.hd{display:none}.mod .st{grid-column:2}.mod .ac{grid-column:3;grid-row:1/span 2}}

/* Módulo */
.crumb{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumb button{background:none;border:0;color:var(--c2);cursor:pointer;padding:0}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stp{display:grid;gap:6px;font-size:12.5px;color:var(--muted);text-align:left;background:none;border:0;padding:0;cursor:default}
.stp i{display:block;height:4px;border-radius:2px;background:var(--panel2);overflow:hidden}
.stp i::after{content:"";display:block;height:100%;width:0;background:var(--accent);transition:width .5s}
.stp.done i::after,.stp.on i::after{width:100%}
.stp.on{color:var(--fg);font-weight:600}
.stp b{font-family:var(--f-mono);font-weight:500;margin-right:4px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.cmp{grid-template-columns:1fr}}
.opt,.ck{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not([disabled]),.ck:hover{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.opt .k{flex:none;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--muted)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--panel2))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--panel2))}
.verd{display:block;font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.opt.right .verd{color:var(--ok)} .opt.wrong .verd{color:var(--bad)}
.ck .box{flex:none;width:20px;height:20px;border-radius:5px;border:1.5px solid var(--muted);display:grid;place-items:center;margin-top:1px;transition:all .15s}
.ck .box svg{width:13px;height:13px;opacity:0}
.ck[aria-pressed="true"]{border-color:var(--ok)}
.ck[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok);color:#fff}
.ck[aria-pressed="true"] .box svg{opacity:1}
.prompt{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--c2);border-radius:8px;padding:12px 14px;white-space:pre-wrap;font-size:14px}
.prompt.voz{border-left-color:var(--c3)}
ol.todo{list-style:none;margin:0;padding:0;display:grid;gap:16px}
ol.todo li{display:grid;grid-template-columns:28px 1fr;gap:12px}
ol.todo .n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
ol.todo li.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
ol.todo .b{display:grid;gap:8px;min-width:0}
.apps{display:flex;flex-wrap:wrap;gap:8px}
.app{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;text-decoration:none;color:var(--fg)}
.app:hover{border-color:var(--accent)}
.app.sel{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--panel2))}
.app .mic{color:var(--c3);font-family:var(--f-mono);font-size:10.5px}
.app .dt{width:8px;height:8px;border-radius:50%;background:var(--dc)}
textarea,input[type=text]{font:inherit;width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:10px 12px}
textarea{min-height:120px;resize:vertical}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--accent)}
.tip{font-size:13px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tip b{color:var(--accent)}
.meter4{display:flex;gap:4px}
.meter4 i{flex:1;height:6px;border-radius:3px;background:var(--panel2);border:1px solid var(--line)}
.meter4 i.on{background:var(--ok);border-color:var(--ok)}
.result{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
@media (max-width:560px){.result{grid-template-columns:1fr;justify-items:start}}
.ring{width:132px;height:132px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{stroke-dasharray:326.7;stroke-dashoffset:var(--off);animation:rf 1.1s cubic-bezier(.2,.9,.3,1) both}
@keyframes rf{from{stroke-dashoffset:326.7}}
.ring .lab{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:30px;font-variant-numeric:tabular-nums}

/* Laboratorio de voz */
.vu{display:grid;grid-template-columns:repeat(32,1fr);gap:3px;height:56px;align-items:end;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px}
.vu i{display:block;height:100%;border-radius:2px;background:var(--line);transition:background .06s}
.vu i.g{background:var(--ok)} .vu i.y{background:var(--warn)} .vu i.r{background:var(--bad)}
.wave{max-width:100%;min-width:0;width:100%;height:72px;display:block;background:var(--panel2);border:1px solid var(--line);border-radius:8px}
.readout{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.readout b{color:var(--fg);font-weight:500}
#mst{white-space:normal;align-items:flex-start}
#mst::before{margin-top:6px}
.rec{width:10px;height:10px;border-radius:50%;background:var(--bad);display:inline-block;animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}

/* Tablas */
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums;min-width:560px}
th{position:sticky;top:0;background:var(--panel2);text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num{text-align:right;font-family:var(--f-mono);font-size:12.5px}

/* Gráficos */
.radar{width:100%;max-width:440px;height:auto;display:block;margin:0 auto}
.radar text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.radar .shape{transform-box:view-box;transform-origin:170px 150px;animation:pop .8s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{transform:scale(.4);opacity:.3}}
.hbars{display:grid;gap:9px}
.hb{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.hb .tr{height:10px;border-radius:3px;background:var(--panel2);overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--accent);transform-origin:left;animation:grow 1s cubic-bezier(.2,.9,.3,1) both}
.hb .n{text-align:right;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
@media (max-width:480px){.hb{grid-template-columns:110px 1fr 40px}}
.legal{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:6px;font-size:12px;color:var(--muted);line-height:1.5}
.legal p{max-width:120ch}
.reg{max-width:560px;margin:4vh auto 0;width:100%}
.radios{display:grid;gap:8px}
.radio{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.radio input{margin-top:3px;accent-color:var(--accent)}
.radio:has(input:checked){border-color:var(--accent)}
.confirm{display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);color:var(--fg);padding:10px 16px;border-radius:8px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100vw - 32px)}
.enter{animation:in .35s ease-out both}
@keyframes in{from{transform:translateY(8px);opacity:.4}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div class="tl" id="root"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const COMP={pedir:"Pedir claro",contexto:"Dar contexto",iterar:"Iterar",verificar:"Verificar",datos:"Proteger datos",elegir:"Elegir herramienta",voz:"Comunicar por voz"};

  {id:"grok",n:"Grok",co:"xAI · EE.UU.",u:"https://grok.com",c:"#8C97A6",voz:true},
  {id:"deepseek",n:"DeepSeek",co:"DeepSeek · China",u:"https://chat.deepseek.com",c:"#A98BE8",voz:false}
];
const VOZ=[

  {ia:"Gemini",f:"Gemini Live, en español",d:"App Android e iOS",e:"Disponible",src:"https://www.xatakandroid.com/aplicaciones-android/ahora-gemini-live-llega-espana-puedes-conversar-viva-voz-asistente-futuro-espanol"},
  {ia:"Claude",f:"Modo de voz",d:"Apps móviles y claude.ai",e:"Disponible",src:"https://beginnersinai.org/ai-voice-modes-compared-2026/"},
  {ia:"Grok",f:"Modo de voz",d:"App iOS y Android",e:"Disponible",src:"https://beginnersinai.org/ai-voice-modes-compared-2026/"},
  {ia:"DeepSeek",f:"Respuestas por voz en prueba para algunos usuarios",d:"Usar el dictado del teclado",e:"Por confirmar",src:"https://www.neoteo.com/en/deepseek-tests-voice-replies-and-four-profiles-for-some-app-users"}
];
const LEVELS=[{n:1,t:"Fundamentos"},{n:2,t:"Uso diario"},{n:3,t:"Criterio avanzado"}];
const M=[
 {id:"m01",lv:1,c:"pedir",t:"Primer contacto con una IA",s:"Abra una IA y pídale que explique, en lenguaje simple, qué puede hacer por usted.",

const Zen={ctx:null,master:null,on:false,ducked:false,vol:.35,t:null,
  build(){const A=window.AudioContext||window.webkitAudioContext;if(!A)return false;const c=this.ctx=new A();
    this.master=c.createGain();this.master.gain.value=0;this.master.connect(c.destination);
    const dl=c.createDelay(2);dl.delayTime.value=.46;const fb=c.createGain();fb.gain.value=.42;const lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2000;
    dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(this.master);this.send=c.createGain();this.send.gain.value=.55;this.send.connect(dl);
    [110,164.81,220,277.18].forEach((f,i)=>{const o=c.createOscillator();o.type=i%2?"triangle":"sine";o.frequency.value=f;o.detune.value=(i-1.5)*5;
      const pf=c.createBiquadFilter();pf.type="lowpass";pf.frequency.value=700;const g=c.createGain();g.gain.value=.05/(1+i*.5);
      const l=c.createOscillator();l.frequency.value=.04+i*.025;const lg=c.createGain();lg.gain.value=.028/(1+i*.5);l.connect(lg);lg.connect(g.gain);
      o.connect(pf);pf.connect(g);g.connect(this.master);g.connect(this.send);o.start();l.start();});
    return true;},
  level(){return this.on&&!this.ducked?this.vol:0;},
  apply(sec){if(!this.ctx)return;const g=this.master.gain,n=this.ctx.currentTime;g.cancelScheduledValues(n);g.setValueAtTime(g.value,n);g.linearRampToValueAtTime(this.level(),n+(sec||1.5));},

const Mic={stream:null,ctx:null,an:null,raf:0,peak:-90,
  async start(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return "unsupported";
    try{this.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});}catch(e){return e&&e.name||"error";}
    const A=window.AudioContext||window.webkitAudioContext;this.ctx=new A();const src=this.ctx.createMediaStreamSource(this.stream);
    this.an=this.ctx.createAnalyser();this.an.fftSize=1024;src.connect(this.an);this.peak=-90;Zen.duck(true);this.loop();return null;},
  loop(){const buf=new Float32Array(this.an.fftSize),cv=document.getElementById("wave"),vu=document.querySelectorAll("#vu i");
    const draw=()=>{if(!this.an)return;this.an.getFloatTimeDomainData(buf);let s=0;for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i];
      const rms=Math.sqrt(s/buf.length),db=Math.max(-90,20*Math.log10(rms+1e-9));this.peak=Math.max(this.peak-.4,db);
      const lv=Math.min(1,Math.max(0,(db+60)/60)),on=Math.round(lv*vu.length);
      vu.forEach((x,i)=>{x.className=i<on?(i<vu.length*.65?"g":i<vu.length*.85?"y":"r"):"";});
      const e=id=>document.getElementById(id);if(e("mdb"))e("mdb").textContent=db.toFixed(1)+" dBFS";if(e("mpk"))e("mpk").textContent=this.peak.toFixed(1)+" dBFS";
      if(e("mst")){const st=db<-50?["bad","Sin voz detectada. Acérquese al micrófono o hable más fuerte."]:db>-8?["warn","Nivel muy alto. Aléjese un poco."]:["ok","Nivel correcto."];e("mst").className="pill "+st[0];e("mst").textContent=st[1];}
      if(cv){const w=cv.width=cv.clientWidth*(window.devicePixelRatio||1),h=cv.height=cv.clientHeight*(window.devicePixelRatio||1),x=cv.getContext("2d");
        x.clearRect(0,0,w,h);x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue("--accent");x.lineWidth=2*(window.devicePixelRatio||1);x.beginPath();
        for(let i=0;i<buf.length;i+=4){const px=i/buf.length*w,py=h/2+buf[i]*h*1.6;i?x.lineTo(px,py):x.moveTo(px,py);}x.stroke();}
      this.raf=requestAnimationFrame(draw);};draw();},
  stop(){cancelAnimationFrame(this.raf);if(this.stream)this.stream.getTracks().forEach(t=>t.stop());this.stream=null;if(this.ctx)try{this.ctx.close();}catch(e){}this.ctx=null;this.an=null;Zen.duck(false);},
  get active(){return !!this.an;}
};

function radar(sc){const keys=Object.keys(COMP),cx=170,cy=150,R=100;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/keys.length;return [cx+Math.cos(a)*R*v,cy+Math.sin(a)*R*v];};
  const ring=v=>keys.map((_,i)=>pt(i,v).join(",")).join(" ");
  return `<svg class="radar" viewBox="-60 0 460 300" role="img" aria-label="Radar de competencias">
    ${[.25,.5,.75,1].map(v=>`<polygon points="${ring(v)}" fill="none" style="stroke:var(--grid)"/>`).join("")}
    ${keys.map((_,i)=>{const [x,y]=pt(i,1);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" style="stroke:var(--grid)"/>`;}).join("")}
    <polygon class="shape" points="${keys.map((k,i)=>pt(i,Math.max(sc[k],3)/100).join(",")).join(" ")}" style="fill:var(--accent-soft);stroke:var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    ${keys.map((k,i)=>{const [x,y]=pt(i,1);return `<circle cx="${x+(pt(i,Math.max(sc[k],3)/100)[0]-x)}" cy="${y+(pt(i,Math.max(sc[k],3)/100)[1]-y)}" r="3" style="fill:var(--accent)"/>`;}).join("")}
    ${keys.map((k,i)=>{const [x,y]=pt(i,1.18);const anc=Math.abs(x-cx)<10?"middle":x>cx?"start":"end";return `<text x="${x}" y="${y+4}" text-anchor="${anc}">${COMP[k]}</text>`;}).join("")}</svg>`;}

      </tbody></table></div></section></div>
    <section class="card enter"><p class="eyebrow">Protección de datos</p><h2>Política de uso</h2>
      <p class="note">No ingrese en ninguna IA claves, números de tarjeta o cuentas bancarias, documentos de identidad, datos de salud ni información de clientes, proveedores o terceros. Anonimice todo documento antes de pegarlo. La información ingresada puede ser almacenada y procesada por el proveedor de cada IA conforme a sus propias políticas de privacidad, que deben revisarse antes de su uso con fines laborales.</p></section>`;
}
function vEquipo(){
  const rows=family.slice().sort((a,b)=>okCount(b)-okCount(a));
  return `<section class="card enter"><div class="card-h"><div><p class="eyebrow">Supervisión</p><h2>Avance del equipo</h2></div><span class="small muted">Solo visible para usted</span></div>
    ${rows.length?`<div class="tw"><table><thead><tr><th>Persona</th><th>Completados</th><th>Promedio</th><th>Voz</th><th>IAs</th><th>Más débil</th><th>Última actividad</th><th></th></tr></thead><tbody>
    ${rows.map(p=>{const sc=comp(p.res||{}),ks=Object.keys(sc).sort((a,b)=>sc[a]-sc[b]),n=okCount(p);
      return `<tr><td><b>${esc(p.perfil&&p.perfil.nombre||"Sin nombre")}</b></td><td class="num">${n}/${M.length}</td><td class="num">${avgOf(p)}%</td><td class="num">${vozOf(p)}/3</td><td class="num">${appsOf(p).size}/5</td>
        <td>${n?COMP[ks[0]]:"—"}</td><td class="num">${p.actualizado?new Date(p.actualizado).toLocaleDateString("es-CL"):"—"}</td><td>${p._id===myId?`<span class="muted small">Usted</span>`:confirmUI("fam:"+p._id,"Quitar","")}</td></tr>`;}).join("")}</tbody></table></div>`
    :`<p class="note">Aún no hay participantes registrados. Comparta esta página con su equipo.</p>`}</section>`;
}
function vLegal(){return `<footer class="legal"><p>Método Espejo · Programa de formación práctica. El progreso se registra con nombre, puntajes y fechas; no se almacenan las respuestas de las IAs ni el audio del micrófono.</p></footer>`;}

function render(){
  if(tab!=="voz"){if(Mic.active)Mic.stop();if(Dict.rec)Dict.stop();}
  const r=$("#root");
  if(!S.perfil){r.innerHTML=vHead()+vRegistro()+vLegal();return;}
  let page=tab==="modulo"?vModulo():tab==="voz"?vVoz():tab==="progreso"?vProgreso():tab==="ref"?vRef():tab==="equipo"&&isOwner?vEquipo():(tab="programa",vPrograma());
  r.innerHTML=vHead()+vKpis()+vTabs()+`<div class="page">${page}</div>`+vLegal();
}
function go(fn){fn();render();window.scrollTo({top:0,behavior:reduce?"auto":"smooth"});}

/* ---------- Eventos ---------- */
document.addEventListener("input",e=>{const id=e.target.id;
  if(id==="rname")reg.nombre=e.target.value;
  if(id==="ename")draft.ename=e.target.value;
  if(id==="dtx"){draft.dict=e.target.value;Dict.final=e.target.value;}
  if(id==="zvol")Zen.setVol(parseFloat(e.target.value));
  if(id&&id.startsWith("resp")){draft.resp=draft.resp||[];draft.resp[+id.slice(4)]=e.target.value;}});
document.addEventListener("change",e=>{if(e.target.name==="exp")reg.exp=+e.target.value;if(e.target.id==="rok")reg.ok=e.target.checked;});
document.addEventListener("click",async e=>{
  const pick=e.target.closest("a[data-pick]");
  if(pick){const m=M.find(x=>x.id===cur);let a=draft.apps||[];const id=pick.dataset.pick;if(!a.includes(id)){a.push(id);if(a.length>(m.mir?2:1))a.shift();}draft.apps=a;setTimeout(render,60);return;}
  const b=e.target.closest("button");if(!b||b.disabled)return;const act=b.dataset.act;
  if(act==="tema"){const nx=isDark()?"light":"dark";document.documentElement.setAttribute("data-theme",nx);try{localStorage.setItem("ep-tema",nx);}catch(err){}render();return;}
  if(act==="zen"){if(Zen.on)Zen.stop();else if(!Zen.start()){toast("Este navegador no permite reproducir audio.");return;}
    const z=b.closest(".zen");if(z){z.classList.toggle("on",Zen.on);b.setAttribute("aria-pressed",String(Zen.on));b.lastChild.textContent="Música zen "+(Zen.on?"activa":"apagada");
      let rg=z.querySelector("input");if(Zen.on&&!rg){z.insertAdjacentHTML("beforeend",`<input type="range" id="zvol" min="0" max="1" step="0.05" value="${Zen.vol}" aria-label="Volumen de la música">`);}else if(!Zen.on&&rg)rg.remove();}return;}
  if(act==="registrar"){const n=(reg.nombre||"").trim();if(!n){toast("Ingrese su nombre.");$("#rname").focus();return;}if(reg.exp===null){toast("Seleccione su experiencia con IA.");return;}if(!reg.ok){toast("Confirme la política de protección de datos para continuar.");return;}
    S.perfil={nombre:n,nivel:EXP[reg.exp][2],inicio:Date.now()};persist();go(()=>tab="programa");return;}
  if(b.dataset.tab){ask=null;go(()=>tab=b.dataset.tab);return;}
  if(b.dataset.m){const m=M.find(x=>x.id===b.dataset.m);if(!unlocked(S,m.lv)){toast("Este nivel requiere completar 4 de 5 módulos del nivel anterior.");return;}
    cur=m.id;step=0;draft={order:Math.random()<.5?["good","bad"]:["bad","good"]};go(()=>tab="modulo");return;}
  if(b.dataset.quiz!==undefined){draft.quiz=+b.dataset.quiz;render();return;}
  if(b.dataset.step){go(()=>step=+b.dataset.step);return;}
  if(act==="copiar"){const t=M.find(x=>x.id===cur).p;try{navigator.clipboard.writeText(t).then(()=>{draft.copied=true;render();toast("Texto copiado.");},()=>sel("#ptext"));}catch(err){sel("#ptext");}return;}
  if(b.dataset.ck!==undefined){draft.ck=draft.ck||[];const i=+b.dataset.ck;draft.ck[i]=!draft.ck[i];const n=draft.ck.filter(Boolean).length;b.setAttribute("aria-pressed",String(!!draft.ck[i]));
    document.querySelectorAll("#meter i").forEach((x,j)=>x.classList.toggle("on",j<n));const c=$("#ckn");if(c)c.textContent=n+" / 4";return;}
  if(act==="guardar"){const before=[unlocked(S,2),unlocked(S,3)],score=(draft.ck||[]).filter(Boolean).length,ok=score>=3,prev=S.res[cur];
    const racha=ok?((prev&&prev.ok?prev.racha||0:0)+1):0,gap=ok?[2,5,10][Math.min(racha-1,2)]:1;
    S.res[cur]={score,ok,apps:draft.apps||[],fecha:Date.now(),intentos:(prev?prev.intentos||0:0)+1,racha,repaso:(ok&&racha>3)?0:Date.now()+gap*DAY};
    S.dias=[...new Set([...(S.dias||[]),dayKey(Date.now())])].slice(-180);persist();
    last={score,ok,lv:[2,3].find((l,i)=>!before[i]&&unlocked(S,l))||0};go(()=>step=4);return;}
  if(act==="mic-start"){const err=await Mic.start();if(err){const m=$("#mmsg");if(m)m.textContent=err==="NotAllowedError"||err==="SecurityError"?"El navegador bloqueó el micrófono. En la versión de claude.ai no está disponible; ábralo en lc1733.github.io/metodo-espejo/profesional/ o revise los permisos del navegador.":err==="unsupported"?"Este navegador no permite acceder al micrófono.":"No se pudo activar el micrófono ("+err+").";if(m)m.style.color="var(--bad)";return;}
    S.voz=S.voz||{mic:0,dict:0};S.voz.mic=(S.voz.mic||0)+1;persist();
    b.dataset.act="mic-stop";b.className="btn ghost";b.innerHTML="Detener prueba";const h=b.closest(".card").querySelector(".card-h");if(h&&!h.querySelector(".rec"))h.insertAdjacentHTML("beforeend",`<span class="small" style="display:inline-flex;gap:6px;align-items:center"><span class="rec"></span>Escuchando</span>`);return;}
  if(act==="mic-stop"){Mic.stop();render();return;}
  if(act==="dict-start"){const err=Dict.start();if(err){toast(err==="unsupported"?"Este navegador no ofrece dictado.":"No se pudo iniciar el dictado.");return;}S.voz=S.voz||{mic:0,dict:0};S.voz.dict=(S.voz.dict||0)+1;persist();paintDict();return;}
  if(act==="dict-stop"){Dict.stop();return;}
  if(act==="dict-copy"){const t=($("#dtx")||{}).value||"";if(!t.trim()){toast("No hay texto para copiar.");return;}try{navigator.clipboard.writeText(t).then(()=>toast("Texto copiado. Péguelo en la IA."),()=>sel("#dtx"));}catch(err){sel("#dtx");}return;}
  if(act==="dict-clear"){draft.dict="";Dict.final="";const t=$("#dtx");if(t)t.value="";const w=$("#dwc");if(w)w.textContent="0";return;}
  if(b.dataset.ask!==undefined){ask=b.dataset.ask||null;render();return;}
  if(b.dataset.do){const k=b.dataset.do;ask=null;
    if(k==="todo"){S={perfil:null,res:{},dias:[],voz:{mic:0,dict:0},actualizado:0};draft={};reg={exp:null,ok:false,nombre:""};try{localStorage.removeItem(KEY);}catch(err){}
      if(docRef){const r=docRef;saving=saving.then(()=>r.delete()).catch(()=>{});}go(()=>tab="programa");toast("Progreso eliminado.");return;}
    if(k.startsWith("res:")){delete S.res[k.slice(4)];persist();render();toast("Registro eliminado.");return;}
    if(k.startsWith("fam:")&&dbRef){dbRef.collection("progreso").doc(k.slice(4)).delete().then(()=>toast("Participante quitado."),()=>toast("No se pudo quitar. Intente de nuevo."));render();return;}
    render();return;}
  if(b.dataset.nivel){S.perfil.nivel=+b.dataset.nivel;persist();render();toast("Nivel actualizado.");return;}
  if(act==="guardar-nombre"){const n=(draft.ename??S.perfil.nombre).trim();if(!n){toast("El nombre no puede quedar vacío.");return;}S.perfil.nombre=n;delete draft.ename;persist();render();toast("Nombre guardado.");return;}
});
function sel(q){const el=$(q);if(!el)return;if(el.select){el.select();}else{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);}toast("Texto seleccionado: cópielo con el menú.");}
try{matchMedia("(prefers-color-scheme: light)").addEventListener("change",()=>{if(!document.documentElement.hasAttribute("data-theme"))render();});}catch(e){}
render();

/* ---------- Registro compartido (solo en claude.ai) ---------- */
(async()=>{
  if(!window.claude||!window.claude.use)return;
  const [user,db]=await Promise.all([claude.use("user"),claude.use("db")]);if(!user||!db)return;
  try{isOwner=await user.isOwner();const uid=await user.id();myId=uid;dbRef=db;docRef=db.collection("progreso").doc(uid);const snap=await docRef.get();
    if(snap.exists){const d=snap.data();if((d.actualizado||0)>=(S.actualizado||0)){S=Object.assign({perfil:null,res:{},dias:[],voz:{mic:0,dict:0},actualizado:0},JSON.parse(JSON.stringify(d)));try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}else persist();mode="compartido";}
    else if(S.perfil)persist();
    if(isOwner)db.collection("progreso").onSnapshot(qs=>{family=qs.docs.filter(d=>d.exists).map(d=>Object.assign({_id:d.id},d.data()));if(tab==="equipo")render();},()=>{});
    if(tab!=="voz"&&tab!=="modulo")render();
  }catch(e){docRef=null;mode="local";}
})();
})();
</script>
