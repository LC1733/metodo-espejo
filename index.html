<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Método Espejo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: juego de bloques en una columna (máx. 560px): cabecera blanca con contornos gruesos, mundo 3D en marco, lista de misiones, barra inferior; cielo de día */
:root{
  --sky-a:#4FC3FF; --sky-b:#C9F0FF; --panel:#FFFFFF; --panel2:#EEF5FB; --soft:#D5DEEA;
  --line:#1B2440; --ink:#1B2440; --muted:#56627F; --white:#FFFFFF;
  --green:#2BD46A; --green-d:#179445; --blue:#2E9BFF; --blue-d:#1767B8; --yellow:#FFC93C; --yellow-d:#C9930A;
  --red:#FF5A5A; --red-d:#B83232; --purple:#9B6BFF; --purple-d:#6A3FD1; --lock:#C3CCDD; --lock-d:#8C97AE;
  --f-d:"Lilita One","Arial Rounded MT Bold","Arial Black",system-ui,sans-serif;
  --f-b:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:linear-gradient(180deg,var(--sky-a) 0%,var(--sky-b) 55%,#EAFBFF 100%) fixed;background-color:var(--sky-b);color:var(--ink);font:17px/1.55 var(--f-b);overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body.has-nav{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:4px solid var(--yellow);outline-offset:3px;border-radius:12px}
h1,h2,h3{font-family:var(--f-d);font-weight:400;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2.2rem} h2{font-size:1.6rem} h3{font-size:1.2rem}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.9rem}
.eyebrow{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.wrap{max-width:560px;margin:0 auto}
.center{text-align:center;justify-items:center}
.title-out{color:var(--white);text-shadow:3px 0 0 var(--line),-3px 0 0 var(--line),0 3px 0 var(--line),0 -3px 0 var(--line),2px 2px 0 var(--line),-2px 2px 0 var(--line),2px -2px 0 var(--line),-2px -2px 0 var(--line),0 6px 0 var(--line)}

/* Nubes de bloque */
.clouds{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.clouds i{position:absolute;width:120px;height:34px;background:#fff;border-radius:10px;opacity:.85;
  box-shadow:30px -18px 0 -2px #fff,62px -8px 0 0 #fff;animation:cloud linear infinite}
.clouds i:nth-child(1){top:14%;left:-140px;animation-duration:70s}
.clouds i:nth-child(2){top:38%;left:-140px;animation-duration:95s;animation-delay:-40s;transform:scale(.7)}
.clouds i:nth-child(3){top:66%;left:-140px;animation-duration:85s;animation-delay:-20s}
@keyframes cloud{to{translate:calc(100vw + 300px) 0}}

/* Cabecera */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--panel);border-bottom:3px solid var(--line);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.topin{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-d);font-size:1.25rem;margin-right:auto;white-space:nowrap}
.logo svg{width:30px;height:30px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:12px;background:var(--panel2);border:2px solid var(--line);font-family:var(--f-d);font-size:1.05rem;font-variant-numeric:tabular-nums}
.chip svg{width:18px;height:18px}
.chip.fire svg{color:var(--red)} .chip.xp svg{color:var(--yellow-d)}
.iconbtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--panel2);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);flex:none}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.iconbtn svg{width:22px;height:22px}
.mbar{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.pbar{flex:1;height:20px;border-radius:10px;background:var(--panel2);border:3px solid var(--line);overflow:hidden}
.pbar i{display:block;height:100%;width:var(--w);background:var(--green);box-shadow:inset 0 -5px 0 var(--green-d),inset 0 4px 0 rgba(255,255,255,.45);animation:fillw .6s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes fillw{from{width:var(--from)}}
.steplab{font-family:var(--f-d);font-size:1rem;min-width:76px;text-align:right}

/* Navegación inferior */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--panel);border-top:3px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.navin{max-width:560px;margin:0 auto;display:flex;justify-content:space-around;gap:2px}
.navb{display:grid;justify-items:center;gap:2px;padding:4px 2px;min-width:58px;color:var(--muted);font-size:.76rem;font-weight:700}
.navb .ic{width:46px;height:36px;border-radius:12px;display:grid;place-items:center;border:2px solid transparent;transition:transform .2s}
.navb svg{width:24px;height:24px}
.navb[aria-current="page"]{color:var(--ink)}
.navb[aria-current="page"] .ic{background:var(--green);color:var(--white);border-color:var(--line);box-shadow:0 3px 0 var(--line);transform:translateY(-3px)}

main{padding-top:18px;display:grid;gap:18px}
.app[data-anim="1"] .enter{animation:enter .5s cubic-bezier(.2,.9,.3,1.25) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes enter{from{transform:translateY(24px) scale(.95);opacity:.3}}

/* Tarjetas y botones */
.card{background:var(--panel);border:3px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--line);padding:20px;display:grid;gap:14px;min-width:0}
.btn{--c:var(--green);--cd:var(--green-d);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:10px 24px;border-radius:16px;
  background:var(--c);color:var(--white);border:3px solid var(--line);font-family:var(--f-d);font-size:1.2rem;letter-spacing:.03em;text-shadow:0 2px 0 rgba(0,0,0,.25);
  box-shadow:inset 0 -6px 0 var(--cd),inset 0 4px 0 rgba(255,255,255,.35),0 4px 0 var(--line);transition:transform .07s,box-shadow .07s}
.btn:active{transform:translateY(3px);box-shadow:inset 0 -3px 0 var(--cd),0 1px 0 var(--line)}
.btn.wide{width:100%}
.btn.blue{--c:var(--blue);--cd:var(--blue-d)}
.btn.sun{--c:var(--yellow);--cd:var(--yellow-d);color:var(--ink);text-shadow:none}
.btn.alt{--c:var(--panel);--cd:var(--soft);color:var(--ink);text-shadow:none}
.btn.sm{min-height:42px;padding:6px 14px;font-size:1rem;border-radius:13px}
.btn.danger{--c:var(--panel);--cd:#FFD6D6;color:var(--red-d);text-shadow:none;min-height:42px;padding:6px 14px;font-size:1rem}
.btn.danger.solid{--c:var(--red);--cd:var(--red-d);color:var(--white)}
.btn:disabled{--c:var(--lock);--cd:var(--lock-d);color:var(--white);cursor:not-allowed}
.btn:disabled:active{transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}

/* Mascota 2D */
.mascot{width:var(--s,96px);height:auto;flex:none;overflow:visible}
.mascot .bodyg{transform-box:view-box;transform-origin:60px 120px;animation:float 3s ease-in-out infinite}
.mascot .eyes{transform-box:view-box;transform-origin:60px 52px;animation:blink 4.6s infinite}
.mascot.m-party .bodyg{animation:jump .8s ease-in-out infinite}
.mascot.m-think .bodyg{animation:tilt 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes jump{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-18px) rotate(-7deg)}60%{transform:translateY(-4px) rotate(6deg)}}
@keyframes tilt{50%{transform:rotate(-6deg)}}
.say{display:flex;gap:10px;align-items:flex-end}
.bubble{position:relative;flex:1;min-width:0;background:var(--panel);border:3px solid var(--line);border-radius:18px 18px 18px 4px;box-shadow:0 4px 0 var(--line);padding:12px 16px;font-weight:700;line-height:1.4}
.bubble small{display:block;font-weight:400;margin-top:4px;color:var(--muted)}

/* Formularios y opciones */
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:12px;height:12px;border-radius:4px;background:var(--panel);border:2px solid var(--line);transition:width .3s,background .3s}
.dots i.on{width:28px;background:var(--green)}
input[type=text],textarea{font:inherit;width:100%;border:3px solid var(--line);border-radius:14px;padding:13px 15px;background:var(--panel2);color:var(--ink)}
input[type=text]:focus,textarea:focus{background:var(--panel);outline:none;box-shadow:0 0 0 4px var(--yellow)}
input.big{font-family:var(--f-d);font-size:1.5rem;text-align:center}
textarea{min-height:120px;resize:vertical}
.opts{display:grid;gap:10px}
.opt,.ck{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--panel);border:3px solid var(--line);border-radius:16px;padding:12px 14px;
  box-shadow:0 4px 0 var(--line);transition:transform .07s,box-shadow .07s,background .2s}
.opt:active,.ck:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt .key{flex:none;width:40px;height:40px;border-radius:11px;border:3px solid var(--line);display:grid;place-items:center;font-family:var(--f-d);font-size:1.2rem;background:var(--panel2)}
.opt .txt{flex:1;min-width:0}
.opt.sel{background:#E3F2FF} .opt.sel .key{background:var(--blue);color:var(--white)}
.opt.right{background:#DDF8E7} .opt.right .key{background:var(--green);color:var(--white)}
.opt.wrong{background:#FFE3E3} .opt.wrong .key{background:var(--red);color:var(--white)}
.opt:disabled{cursor:default}
.verdict{display:block;font-family:var(--f-d);font-size:.95rem;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.opt.right .verdict{color:var(--green-d)} .opt.wrong .verdict{color:var(--red-d)}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.ck .box{flex:none;width:34px;height:34px;border-radius:10px;border:3px solid var(--line);background:var(--panel2);display:grid;place-items:center;color:var(--white);transition:all .2s cubic-bezier(.2,.9,.3,1.5)}
.ck .box svg{width:22px;height:22px;stroke-dasharray:30;stroke-dashoffset:30;transition:stroke-dashoffset .3s .05s}
.ck[aria-pressed="true"]{background:#DDF8E7}
.ck[aria-pressed="true"] .box{background:var(--green);transform:scale(1.12) rotate(-6deg)}
.ck[aria-pressed="true"] .box svg{stroke-dashoffset:0}
.meter4{display:flex;gap:6px}
.meter4 i{flex:1;height:16px;border-radius:6px;background:var(--panel2);border:2px solid var(--line);transition:background .25s}
.meter4 i.on{background:var(--green)}
.meter4 i.on:nth-child(n+3){background:var(--yellow)}
.tip{background:#FFF4CC;border:3px solid var(--line);border-radius:16px;padding:12px 15px;font-size:.96rem}
.tip b{color:var(--yellow-d)}
.prompt{background:var(--panel2);border:3px dashed var(--blue);border-radius:14px;padding:15px;white-space:pre-wrap;font-size:1.02rem}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.compare{grid-template-columns:1fr}}
ol.todo{list-style:none;margin:0;padding:0;display:grid;gap:20px}
ol.todo li{display:flex;gap:12px;align-items:flex-start}
ol.todo .num{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-d);font-size:1.3rem;border:3px solid var(--line);background:var(--panel2);box-shadow:0 3px 0 var(--line);transition:all .25s}
ol.todo .num svg{width:22px;height:22px}
ol.todo li.done .num{background:var(--green);color:var(--white);transform:rotate(-6deg) scale(1.06)}
ol.todo .body{flex:1;min-width:0;display:grid;gap:10px}
.apps{display:flex;flex-wrap:wrap;gap:10px}
.appchip{display:inline-flex;align-items:center;gap:9px;min-height:46px;padding:8px 15px;border-radius:14px;background:var(--panel);border:3px solid var(--line);
  text-decoration:none;font-weight:700;box-shadow:0 4px 0 var(--line);transition:transform .07s,box-shadow .07s}
.appchip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.appchip .dot,.pill .dot{width:12px;height:12px;border-radius:4px;border:2px solid var(--line);background:var(--dc)}
.appchip.sel{background:#DDF8E7}
.choice{padding:9px 14px;border-radius:12px;background:var(--panel);border:3px solid var(--line);font-weight:700;box-shadow:0 3px 0 var(--line)}
.choice[aria-pressed="true"]{background:var(--green);color:var(--white)}

/* Mundo 3D */
.world{position:relative;height:min(62vh,540px);min-height:340px;border:3px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 6px 0 var(--line);
  background:linear-gradient(180deg,#5CC8FF 0%,#BDEBFF 70%,#E6F9FF 100%)}
.world canvas,.preview canvas{display:block;width:100%;height:100%;touch-action:pan-y}
.hud-top{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.hud-bot{position:absolute;left:10px;right:10px;bottom:12px;display:flex;justify-content:center}
.hudchip{background:var(--panel);border:3px solid var(--line);border-radius:12px;padding:3px 9px;font-family:var(--f-d);font-size:.88rem;box-shadow:0 3px 0 var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hint{font-family:var(--f-b);font-weight:700;font-size:.78rem;color:var(--muted)}
.preview{position:relative;height:290px;border:3px solid var(--line);border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#7FD6FF,#E6F9FF)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:40px;height:40px;border-radius:12px;border:3px solid var(--line);background:var(--sc);box-shadow:0 3px 0 var(--line);transition:transform .15s}
.sw[aria-pressed="true"]{transform:translateY(-3px) scale(1.08);box-shadow:0 0 0 4px var(--yellow),0 3px 0 var(--line)}

/* Lista de misiones */
.lvhead{display:flex;align-items:center;gap:12px}
.lvnum{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-d);font-size:1.7rem;color:var(--white);
  background:var(--lc);border:3px solid var(--line);box-shadow:inset 0 -5px 0 var(--lcd),0 3px 0 var(--line);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.lvhead.locked .lvnum{--lc:var(--lock);--lcd:var(--lock-d)}
.lvhead .t{flex:1;min-width:0}
.lvmeter{height:12px;border-radius:6px;background:var(--panel2);border:2px solid var(--line);overflow:hidden;margin-top:6px}
.lvmeter i{display:block;height:100%;background:var(--lc);transform-origin:left;animation:grow 1s cubic-bezier(.2,.9,.3,1) both}
.mlist{display:grid;gap:10px}
.mrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:3px solid var(--line);border-radius:16px;padding:8px 12px 8px 8px;
  box-shadow:0 4px 0 var(--line);transition:transform .07s,box-shadow .07s}
.mrow:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.blk{--c:var(--green);--cd:var(--green-d);flex:none;position:relative;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:var(--white);
  background:var(--c);border:3px solid var(--line);box-shadow:inset 0 -5px 0 var(--cd),inset 0 3px 0 rgba(255,255,255,.4);font-family:var(--f-d);font-size:1.25rem;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.blk svg{width:24px;height:24px}
.blk.ok{--c:var(--yellow);--cd:var(--yellow-d)} .blk.rep{--c:var(--red);--cd:var(--red-d)} .blk.lock{--c:var(--lock);--cd:var(--lock-d)}
.mrow .t{flex:1;min-width:0;line-height:1.25}
.mrow .t b{display:block}
.mrow .t small{color:var(--muted)}
.mrow.locked{background:var(--panel2)}
.tag{flex:none;font-family:var(--f-d);font-size:.85rem;padding:3px 8px;border-radius:9px;border:2px solid var(--line);background:var(--blue);color:var(--white)}
.go{flex:none;font-family:var(--f-d);font-size:.9rem;padding:5px 10px;border-radius:10px;border:2px solid var(--line);background:var(--yellow);animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}

/* Resultado y logros */
.ringwrap{position:relative;width:170px;height:170px}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .v{stroke-dasharray:326.7;stroke-dashoffset:var(--off);animation:ringfill 1.3s cubic-bezier(.2,.9,.3,1) both .15s}
@keyframes ringfill{from{stroke-dashoffset:326.7}}
.ringwrap .lab{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-d);font-size:2.8rem}
.ringwrap .lab small{display:block;font-family:var(--f-b);font-size:.9rem;color:var(--muted);text-align:center;margin-top:-6px}
.xpgain{font-family:var(--f-d);font-size:2.2rem;color:var(--yellow);font-variant-numeric:tabular-nums}
.banner{width:100%;border-radius:16px;padding:12px;background:var(--purple);color:var(--white);border:3px solid var(--line);box-shadow:inset 0 -5px 0 var(--purple-d),0 4px 0 var(--line);
  font-family:var(--f-d);font-size:1.2rem;text-shadow:0 2px 0 rgba(0,0,0,.25);animation:popin .6s cubic-bezier(.2,.9,.3,1.5) both .5s}
@keyframes popin{from{transform:scale(.6)}}
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.big{font-family:var(--f-d);font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.xpbar{height:20px;border-radius:10px;background:var(--panel2);border:3px solid var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--yellow);box-shadow:inset 0 -5px 0 var(--yellow-d);transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.9,.3,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--panel2);border:3px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--f-d);font-weight:400;font-size:1.7rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:14px 8px}
.badge{display:grid;justify-items:center;gap:4px;text-align:center;min-width:0;overflow-wrap:anywhere}
.badge svg{width:66px;height:66px;overflow:visible}
.badge b{font-size:.82rem;line-height:1.2}
.badge span{font-size:.72rem;color:var(--muted);line-height:1.2}
.badge.new{animation:popin .7s cubic-bezier(.2,.9,.3,1.6) both}
.radar{width:100%;max-width:420px;height:auto;margin:0 auto;display:block}
.radar text{fill:var(--muted);font-size:11px;font-family:var(--f-b);font-weight:700}
.radar .shape{transform-box:view-box;transform-origin:170px 150px;animation:popin .9s cubic-bezier(.2,.9,.3,1.3) both}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:120px 1fr 42px;gap:10px;align-items:center;font-size:.9rem}
.bar .track{height:16px;border-radius:7px;background:var(--panel2);border:2px solid var(--line);overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--green);transform-origin:left;animation:grow 1s cubic-bezier(.2,.9,.3,1) both}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:700;padding:4px 10px;border-radius:10px;background:var(--panel2);border:2px solid var(--line)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem;min-width:540px}
th,td{text-align:left;padding:10px 8px;border-bottom:2px solid var(--soft);vertical-align:middle}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
td.num{font-variant-numeric:tabular-nums}
.confirm{display:inline-flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Las IAs */
.ias{display:grid;gap:10px}
.ia{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--panel);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);text-decoration:none;transition:transform .15s}
.ia:hover{transform:translateX(4px)}
.ia .av{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--dc);border:3px solid var(--line);font-family:var(--f-d);font-size:1.3rem}
.ia .t{flex:1;min-width:0} .ia .t span{display:block;font-size:.85rem;color:var(--muted)}
.flips{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.flip{perspective:900px;height:132px;text-align:left}
.flip .in{position:relative;display:block;height:100%;transition:transform .55s cubic-bezier(.2,.9,.3,1.2);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;border:3px solid var(--line);padding:12px;display:grid;align-content:center;gap:4px}
.front{background:var(--panel)} .front b{font-family:var(--f-d);font-weight:400;font-size:1.4rem} .front span{font-size:.8rem;color:var(--muted)}
.back{transform:rotateY(180deg);background:var(--green);color:var(--white);font-weight:700;font-size:.95rem;text-shadow:0 1px 0 rgba(0,0,0,.25)}

/* Hoja, toast, confeti */
.backdrop{position:fixed;inset:0;z-index:30;background:rgba(27,36,64,.5);animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:560px;margin:0 auto;background:var(--panel);border:3px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;
  padding:12px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:grid;gap:14px;animation:up .4s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:48px;height:6px;border-radius:3px;background:var(--soft);margin:0 auto}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);z-index:40;transform:translateX(-50%);background:var(--ink);color:var(--white);border:3px solid var(--white);
  padding:9px 18px;border-radius:14px;font-weight:700;box-shadow:0 6px 0 rgba(27,36,64,.35);animation:drop .35s cubic-bezier(.2,.9,.3,1.4) both;max-width:calc(100vw - 32px);text-align:center}
@keyframes drop{from{transform:translate(-50%,-20px) scale(.9)}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

    if(this.hop){const h=this.hop;h.t+=dt/h.d;const k=Math.min(1,h.t);av.position.lerpVectors(h.a,h.b,k);av.position.y+=Math.sin(k*Math.PI)*(2+Math.abs(h.b.y-h.a.y)*.5);
      u.armL.rotation.x=u.armR.rotation.x=-2.8*Math.sin(k*Math.PI);u.legL.rotation.x=.6*Math.sin(k*Math.PI);u.legR.rotation.x=-.6*Math.sin(k*Math.PI);
      if(k>=1){Snd.play("land");av.position.copy(h.b);this.squash=1;this.nextHop();}}
    else{const want=Math.atan2(this.cam.position.x-av.position.x,this.cam.position.z-av.position.z);let df=want-av.rotation.y;df=Math.atan2(Math.sin(df),Math.cos(df));
      if(!this.spin)av.rotation.y+=df*Math.min(1,dt*3);
      u.armL.rotation.x=Math.sin(s*2.2)*.12;u.armR.rotation.x=-Math.sin(s*2.2)*.12;u.legL.rotation.x=u.legR.rotation.x=0;u.head.rotation.z=Math.sin(s*1.5)*.05;}
    if(this.spin){this.spin=Math.max(0,this.spin-dt*1.1);const k=1-this.spin;av.rotation.y+=dt*12*this.spin;av.position.y=this.pos(this.at).y+Math.sin(k*Math.PI)*1.8;
      u.armL.rotation.z=-1.2*Math.sin(k*Math.PI);u.armR.rotation.z=1.2*Math.sin(k*Math.PI);if(!this.spin){setFace(av,"happy");u.armL.rotation.z=u.armR.rotation.z=0;}}
    if(this.nope){this.nope=Math.max(0,this.nope-dt*2.5);u.head.rotation.y=Math.sin(this.nope*20)*.4*this.nope;}
    if(this.squash){this.squash=Math.max(0,this.squash-dt*5);av.scale.set(1+this.squash*.15,1-this.squash*.15,1+this.squash*.15);}
    this.plats.forEach(P=>{if(P.coin&&P.coin.visible){P.coin.rotation.y+=dt*2.5;P.coin.position.y=1.1+Math.sin(s*2+P.i)*.18;}
      if(P.cur)P.topM.emissive.setRGB(.12+.12*Math.sin(s*4),.12+.12*Math.sin(s*4),0);if(P.flag)P.flag.rotation.y=Math.sin(s*3+P.i)*.25;});
    this.clouds.forEach(c=>{c.position.x+=dt*c.userData.v;if(c.position.x>24)c.position.x=-24;});
    this.parts=this.parts.filter(b=>{b.userData.v.y-=dt*14;b.position.addScaledVector(b.userData.v,dt);b.rotation.x+=dt*5;if(b.position.y<av.position.y-8){this.scene.remove(b);b.geometry.dispose();b.material.dispose();return false;}return true;});
    const ct=this.camTarget(),lt=this.lookTarget(),f=1-Math.exp(-dt*3);this.camPos.lerp(ct,f);this.look.lerp(lt,f);this.cam.position.copy(this.camPos);this.cam.lookAt(this.look);
    this.r.render(this.scene,this.cam);}
};

let view="ruta",cur=null,step=0,draft={},ob={i:0,place:[],av:Object.assign({},DEF_AV)},sheet=null,ask=null,lastResult=null,cheerPending=false;

try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}

const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const el=$("#toast");el.hidden=true;void el.offsetWidth;el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2400);}

/* ---------- Cálculos ---------- */
const dayKey=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");};
function streakOf(s){const set=new Set(s.dias||[]);const d=new Date();if(!set.has(dayKey(d)))d.setDate(d.getDate()-1);let n=0;while(set.has(dayKey(d))){n++;d.setDate(d.getDate()-1);}return n;}
function bestStreak(s){const ds=[...new Set(s.dias||[])].sort();let best=0,c=0,prev=null;ds.forEach(k=>{const t=new Date(k+"T12:00:00").getTime();c=(prev&&Math.round((t-prev)/DAY)===1)?c+1:1;best=Math.max(best,c);prev=t;});return best;}
const okOf=(s,id)=>!!(s.res&&s.res[id]&&s.res[id].ok);
const okCount=s=>M.filter(m=>okOf(s,m.id)).length;
const appsOf=s=>{const a=new Set();Object.values(s.res||{}).forEach(r=>(r.apps||[]).forEach(x=>a.add(x)));return a;};
const xpOf=s=>M.reduce((t,m)=>{const r=s.res&&s.res[m.id];return t+(r?r.score*25+(r.ok&&m.mir?50:0):0);},0);
function rankOf(xp){let i=0;RANKS.forEach((r,j)=>{if(xp>=r[0])i=j;});return {i,name:RANKS[i][1],min:RANKS[i][0],next:RANKS[i+1]?RANKS[i+1][0]:null};}
function unlockedFor(s,lv){if(!s.perfil)return false;if(lv<=s.perfil.nivel)return true;const prev=M.filter(m=>m.lv===lv-1);return prev.filter(m=>okOf(s,m.id)).length>=Math.ceil(prev.length*.75);}
const BADGES=[
  {id:"b1",n:"Primer paso",d:"Logra 1 misión",g:"1",c:"#2BD46A",f:s=>okCount(s)>=1},
  {id:"b2",n:"Guardián",d:"Datos privados",g:"!",c:"#FF5A5A",f:s=>okOf(s,"m04")},
  {id:"b3",n:"Doble reflejo",d:"Una Prueba Espejo",g:"×2",c:"#2E9BFF",f:s=>okOf(s,"m07")||okOf(s,"m10")},
  {id:"b4",n:"Cazainventos",d:"Detecta un invento",g:"?!",c:"#FF8A2B",f:s=>okOf(s,"m10")},
  {id:"b5",n:"Explorador",d:"Usa 3 IAs",g:"3",c:"#2E9BFF",f:s=>appsOf(s).size>=3},
  {id:"b6",n:"Las cinco",d:"Usa las 5 IAs",g:"5",c:"#FFC93C",f:s=>appsOf(s).size>=5},
  {id:"b7",n:"Constante",d:"3 días seguidos",g:"3d",c:"#FF5A5A",f:s=>bestStreak(s)>=3},
  {id:"b8",n:"Navegante",d:"Abre el nivel 3",g:"N3",c:"#9B6BFF",f:s=>unlockedFor(s,3)},
  {id:"b9",n:"Maestro",d:"Las 12 misiones",g:"12",c:"#FFC93C",f:s=>okCount(s)>=12}
];
const badgesOf=s=>BADGES.filter(b=>{try{return b.f(s);}catch(e){return false;}}).map(b=>b.id);
function statusOf(m){const r=S.res[m.id];if(!r)return "new";if(r.ok&&(!r.repaso||r.repaso>Date.now()))return "ok";return "rep";}
function compScores(res){const o={};Object.keys(COMP).forEach(k=>{const ms=M.filter(m=>m.c===k);o[k]=Math.round(ms.reduce((a,m)=>a+(res&&res[m.id]?res[m.id].score:0),0)/(ms.length*4)*100);});return o;}
const dueList=()=>M.filter(m=>{const r=S.res[m.id];return r&&r.repaso&&r.repaso<=Date.now();});
const nextMission=()=>M.find(m=>unlockedFor(S,m.lv)&&statusOf(m)==="rep")||M.find(m=>unlockedFor(S,m.lv)&&statusOf(m)==="new");

function radar(sc){const keys=Object.keys(COMP),cx=170,cy=150,R=100;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/keys.length;return [cx+Math.cos(a)*R*v,cy+Math.sin(a)*R*v];};
  const ring=v=>keys.map((_,i)=>pt(i,v).join(",")).join(" ");
  return `<svg class="radar" viewBox="-50 0 440 300" role="img" aria-label="Radar de competencias">
   ${[.25,.5,.75,1].map(v=>`<polygon points="${ring(v)}" fill="none" stroke="#D5DEEA" stroke-width="2"/>`).join("")}
   ${keys.map((_,i)=>{const [x,y]=pt(i,1);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#D5DEEA" stroke-width="2"/>`;}).join("")}
   <polygon class="shape" points="${keys.map((k,i)=>pt(i,Math.max(sc[k],3)/100).join(",")).join(" ")}" fill="#2BD46A" fill-opacity=".45" stroke="#1B2440" stroke-width="3" stroke-linejoin="round"/>
   ${keys.map((k,i)=>{const [x,y]=pt(i,1.2);const anc=Math.abs(x-cx)<10?"middle":x>cx?"start":"end";return `<text x="${x}" y="${y+4}" text-anchor="${anc}">${COMP[k]}</text>`;}).join("")}</svg>`;}

    <div class="row">${APPS.map(a=>`<span class="pill" style="--dc:${a.c}"><span class="dot"></span>${a.n}: ${M.filter(m=>S.res[m.id]&&(S.res[m.id].apps||[]).includes(a.id)).length}</span>`).join("")}</div></section>

/* ---------- Render ---------- */
function typeAll(){if(reduce)return;document.querySelectorAll("#app [data-type]").forEach(el=>{const t=el.textContent;el.textContent="";let i=0;const go=()=>{i+=2;el.textContent=t.slice(0,i);if(i<t.length)setTimeout(go,22);};go();});}
function countUp(){document.querySelectorAll("[data-count]").forEach(el=>{const to=+el.dataset.count;if(reduce){el.textContent=to;return;}const t0=performance.now();
  const f=now=>{const p=Math.min(1,(now-t0)/1000);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f);};requestAnimationFrame(f);});}

  if(Conf.run){const c=$("#confetti"),d=window.devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d;Conf.x.setTransform(d,0,0,d,0,0);}});

/* ---------- Eventos ---------- */
document.addEventListener("input",e=>{const id=e.target.id;
  if(id==="nombre")ob.nombre=e.target.value;
  if(id==="editNombre")draft.editNombre=e.target.value;
  if(id&&id.startsWith("resp")){draft.resp=draft.resp||[];draft.resp[+id.slice(4)]=e.target.value;}});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="nombre"){e.preventDefault();$('[data-act="ob-name"]').click();}
  if(e.key==="Escape"&&sheet){sheet=null;renderSheet();}});
document.addEventListener("click",e=>{
  const pick=e.target.closest("a[data-pick]");
  if(pick){const m=M.find(x=>x.id===cur);let a=draft.apps||[];const id=pick.dataset.pick;if(!a.includes(id)){a.push(id);if(a.length>(m.mir?2:1))a.shift();}
    draft.apps=a;Snd.play("coin");buzz(10);setTimeout(render,60);return;}
  if(e.target.closest(".backdrop")){sheet=null;Snd.play("tap");renderSheet();return;}
  const b=e.target.closest("button");if(!b||b.disabled)return;
  Snd.play("tap");const act=b.dataset.act;
  if(act==="sonido"){Snd.on=!Snd.on;try{localStorage.setItem("me-snd",Snd.on?"1":"0");}catch(err){}if(Snd.on)Snd.play("right");render();return;}
  /* avatar */

    document.querySelectorAll(`[data-av="${k}"]`).forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
    if(S.perfil){S.perfil.av=av;clearTimeout(avTimer);avTimer=setTimeout(persist,700);}
    if(PV.ok){PV.set(av);PV.cheer();}Snd.play("pop");buzz(10);return;}
  /* bienvenida */
  if(act==="ob-next"){Snd.play("next");go(()=>ob.i++);return;}
  if(act==="ob-name"){const n=(ob.nombre||"").trim();if(!n){toast("Escribe tu nombre o apodo");Snd.play("wrong");const inp=$("#nombre");inp.classList.add("shake");inp.focus();return;}Snd.play("next");go(()=>ob.i=2);return;}
  if(b.dataset.place){const [k,j]=b.dataset.place.split(":").map(Number);ob.place[k]=j;
    document.querySelectorAll(`[data-place^="${k}:"]`).forEach(x=>x.classList.toggle("sel",x===b));Snd.play("pop");buzz(10);
    setTimeout(()=>{if(ob.i!==k+3)return;ob.i++;if(ob.i===6){Snd.play("win");setTimeout(()=>Conf.burst(120),150);}render();},380);return;}
  if(act==="ob-back"){go(()=>ob.i=Math.max(1,ob.i-1));return;}
  if(act==="ob-fin"){S.perfil={nombre:(ob.nombre||"").trim(),nivel:+b.dataset.lv,inicio:Date.now(),av:Object.assign({},ob.av)};ob={i:0,place:[],av:Object.assign({},DEF_AV)};persist();Snd.play("level");go(()=>view="ruta");return;}
  /* mundo */
  if(b.dataset.tab){ask=null;go(()=>view=b.dataset.tab);return;}
  if(act==="ir"){const nx=nextMission();if(!nx)return;const i=M.indexOf(nx);W3.goTo(i,()=>{sheet=nx.id;Snd.play("open");renderSheet();});return;}
  if(b.dataset.m){const m=M.find(x=>x.id===b.dataset.m);
    if(!unlockedFor(S,m.lv)){Snd.play("wrong");buzz(30);b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");toast("Se abre al lograr 3 de 4 misiones del nivel anterior");return;}
    if(W3.ok&&view==="ruta")W3.goTo(M.indexOf(m));

  if(act==="salir"){go(()=>{view="ruta";cur=null;});return;}
  if(act==="a-ruta"){if(lastResult&&lastResult.ok)cheerPending=true;W3.at=M.findIndex(m=>m.id===cur);if(W3.av)W3.av.position.copy(W3.pos(W3.at));go(()=>{view="ruta";cur=null;});return;}
  /* misión */
  if(b.dataset.quiz!==undefined){const j=+b.dataset.quiz;draft.quiz=j;const right=draft.order[j]==="good";Snd.play(right?"right":"wrong");buzz(right?15:40);render();
    if(!right){const el=document.querySelector(`[data-quiz="${j}"]`);if(el)el.classList.add("shake");}else Conf.burst(40);return;}
  if(b.dataset.step){Snd.play("next");go(()=>step=+b.dataset.step);return;}
  if(act==="copiar"){const t=M.find(x=>x.id===cur).p;const ok=()=>{draft.copied=true;Snd.play("copy");render();toast("Copiado. Ahora elige la IA");};
    try{navigator.clipboard.writeText(t).then(ok,()=>selectPrompt());}catch(err){selectPrompt();}return;}
  if(act==="limpiar-apps"){draft.apps=[];render();return;}
  if(b.dataset.ck!==undefined){draft.ck=draft.ck||[];const i=+b.dataset.ck;draft.ck[i]=!draft.ck[i];const n=draft.ck.filter(Boolean).length;
    b.setAttribute("aria-pressed",String(!!draft.ck[i]));document.querySelectorAll("#meter i").forEach((x,j)=>x.classList.toggle("on",j<n));
    if(draft.ck[i]){Snd.play("check",n-1);buzz(12);}else Snd.play("uncheck");return;}
  if(act==="guardar"){

    const score=(draft.ck||[]).filter(Boolean).length,ok=score>=3,prev=S.res[cur];
    const racha=ok?((prev&&prev.ok?prev.racha||0:0)+1):0,gap=ok?[2,5,10][Math.min(racha-1,2)]:1;
    S.res[cur]={score,ok,apps:draft.apps||[],fecha:Date.now(),intentos:(prev?prev.intentos||0:0)+1,racha,repaso:(ok&&racha>3)?0:Date.now()+gap*DAY};
    S.dias=[...new Set([...(S.dias||[]),dayKey(Date.now())])].slice(-120);persist();
    const nb=badgesOf(S).filter(x=>!before.b.includes(x)),lu=[2,3].find((l,i)=>!before.l[i]&&unlockedFor(S,l))||0;
    lastResult={score,ok,xp:Math.max(0,xpOf(S)-before.xp),newB:nb,levelUp:lu};go(()=>step=4);
    if(ok){setTimeout(()=>Conf.burst(lu?220:150),250);Snd.play(lu?"level":"win");buzz([20,40,20]);}else Snd.play("soft");

  if(b.dataset.flip!==undefined){b.classList.toggle("on");Snd.play("pop");return;}
  if(b.dataset.ask!==undefined){ask=b.dataset.ask||null;render();return;}

    if(k==="todo"){S={perfil:null,res:{},dias:[],actualizado:0};draft={};ob={i:0,place:[],av:Object.assign({},DEF_AV)};W3.at=-1;
      try{localStorage.removeItem(KEY);}catch(err){}if(docRef){const r=docRef;saving=saving.then(()=>r.delete()).catch(()=>{});}

    if(k.startsWith("fam:")&&dbRef){dbRef.collection("progreso").doc(k.slice(4)).delete().then(()=>toast("Registro quitado"),()=>toast("No se pudo quitar. Intenta de nuevo."));render();return;}
    render();return;}
  if(b.dataset.nivel){S.perfil.nivel=+b.dataset.nivel;persist();render();toast("Nivel actualizado");return;}
  if(act==="guardar-nombre"){const n=(draft.editNombre??S.perfil.nombre).trim();if(!n){toast("El nombre no puede quedar vacío");return;}

});

  if(!user||!db)return;
  try{
    isOwner=await user.isOwner();const uid=await user.id();myId=uid;dbRef=db;
    docRef=db.collection("progreso").doc(uid);const snap=await docRef.get();
    if(snap.exists){const d=snap.data();
      if((d.actualizado||0)>=(S.actualizado||0)){S=Object.assign({perfil:null,res:{},dias:[],actualizado:0},JSON.parse(JSON.stringify(d)));try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
      else persist();mode="compartido";}
    else if(S.perfil)persist();
    if(isOwner)db.collection("progreso").onSnapshot(qs=>{family=qs.docs.filter(d=>d.exists).map(d=>Object.assign({_id:d.id},d.data()));if(view==="familia")render();},()=>{});
    if(view!=="mision")render();
  }catch(e){docRef=null;mode="local";}
})();
})();
</script>
