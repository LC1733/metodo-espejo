<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#040711">
<title>Método Espejo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: una columna (máx. 560px) sobre noche con orbes de luz; cabecera de vidrio, mundo 3D enmarcado, tarjetas de vidrio, barra inferior. Paleta Presencia: dorado, cian, violeta */
:root{
  --modo:oscuro;
  --fondo:#040711; --tarjeta:#0b1222; --hondo:rgba(2,6,23,.55); --linea:rgba(255,255,255,.08); --linea2:rgba(255,255,255,.16);
  --texto:#f1f5f9; --gris:#94a3b8;
  --acento:#fde08d; --acento-texto:#fde68a; --sobre-acento:#1a1204; --acento-suave:rgba(251,191,36,.12); --acento-borde:rgba(253,224,141,.55); --acento-sombra:rgba(253,224,141,.22);
  --tinta:#22d3ee; --tinta-suave:rgba(34,211,238,.12); --extra:#c084fc; --extra-suave:rgba(192,132,252,.13); --alerta:#fb923c; --alerta-suave:rgba(251,146,60,.13); --bien:#34d399;
  --vidrio:linear-gradient(135deg,rgba(15,23,42,.62) 0%,rgba(9,13,26,.82) 100%); --vidrio-fuerte:rgba(9,13,26,.8);
  --boton:linear-gradient(135deg,#fde08d 0%,#f6c86a 100%); --activo:linear-gradient(90deg,rgba(6,182,212,.25),rgba(223,159,40,.25));
  --titulo:linear-gradient(180deg,#ffffff 0%,#f1f5f9 45%,#a5f3fc 100%); --degradado:linear-gradient(135deg,#fde08d,#22d3ee);
  --orbe1:rgba(6,182,212,.14); --orbe2:rgba(245,158,11,.12); --orbe3:rgba(147,51,234,.11);
  --sombra:0 20px 50px rgba(0,0,0,.55);
  --cielo:radial-gradient(120% 90% at 50% 20%,#13213a 0%,#070b18 65%,#040711 100%);
  --f-d:"Cinzel",Georgia,"Times New Roman",serif; --f-b:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-m:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --modo:claro;
  --fondo:#f4efe4; --tarjeta:#fffdf8; --hondo:rgba(255,255,255,.7); --linea:rgba(30,41,59,.10); --linea2:rgba(30,41,59,.18);
  --texto:#1b2333; --gris:#5f6b7d;
  --acento:#b7791f; --acento-texto:#8a5a12; --sobre-acento:#1a1204; --acento-suave:rgba(183,121,31,.12); --acento-borde:rgba(183,121,31,.45); --acento-sombra:rgba(183,121,31,.18);
  --tinta:#0e7490; --tinta-suave:rgba(14,116,144,.1); --extra:#7e22ce; --extra-suave:rgba(126,34,206,.1); --alerta:#c2410c; --alerta-suave:rgba(194,65,12,.1); --bien:#047857;
  --vidrio:linear-gradient(135deg,rgba(255,255,255,.78) 0%,rgba(255,252,245,.9) 100%); --vidrio-fuerte:rgba(255,252,245,.88);
  --boton:linear-gradient(135deg,#f6d27a 0%,#e9b44c 100%); --activo:linear-gradient(90deg,rgba(14,116,144,.14),rgba(183,121,31,.18));
  --titulo:linear-gradient(180deg,#1b2333 0%,#334155 50%,#0e7490 100%); --degradado:linear-gradient(135deg,#e9b44c,#0e7490);
  --orbe1:rgba(14,116,144,.12); --orbe2:rgba(217,160,60,.16); --orbe3:rgba(126,34,206,.07);
  --sombra:0 14px 36px rgba(60,45,20,.12);
  --cielo:radial-gradient(120% 90% at 50% 15%,#fffdf8 0%,#f4efe4 60%,#ece3d1 100%);
  color-scheme:light}}
:root[data-theme="light"]{
  --modo:claro;
  --fondo:#f4efe4; --tarjeta:#fffdf8; --hondo:rgba(255,255,255,.7); --linea:rgba(30,41,59,.10); --linea2:rgba(30,41,59,.18);
  --texto:#1b2333; --gris:#5f6b7d;
  --acento:#b7791f; --acento-texto:#8a5a12; --sobre-acento:#1a1204; --acento-suave:rgba(183,121,31,.12); --acento-borde:rgba(183,121,31,.45); --acento-sombra:rgba(183,121,31,.18);
  --tinta:#0e7490; --tinta-suave:rgba(14,116,144,.1); --extra:#7e22ce; --extra-suave:rgba(126,34,206,.1); --alerta:#c2410c; --alerta-suave:rgba(194,65,12,.1); --bien:#047857;
  --vidrio:linear-gradient(135deg,rgba(255,255,255,.78) 0%,rgba(255,252,245,.9) 100%); --vidrio-fuerte:rgba(255,252,245,.88);
  --boton:linear-gradient(135deg,#f6d27a 0%,#e9b44c 100%); --activo:linear-gradient(90deg,rgba(14,116,144,.14),rgba(183,121,31,.18));
  --titulo:linear-gradient(180deg,#1b2333 0%,#334155 50%,#0e7490 100%); --degradado:linear-gradient(135deg,#e9b44c,#0e7490);
  --orbe1:rgba(14,116,144,.12); --orbe2:rgba(217,160,60,.16); --orbe3:rgba(126,34,206,.07);
  --sombra:0 14px 36px rgba(60,45,20,.12);
  --cielo:radial-gradient(120% 90% at 50% 15%,#fffdf8 0%,#f4efe4 60%,#ece3d1 100%);
  color-scheme:light}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--fondo);color:var(--texto);font:16px/1.55 var(--f-b);-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .25s,color .25s;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body.has-nav{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--fondo)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--acento);outline-offset:3px;border-radius:12px}
h1,h2,h3{font-family:var(--f-d);font-weight:700;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,7vw,38px);font-weight:800} h2{font-size:1.35rem} h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.muted{color:var(--gris)} .small{font-size:.88rem}
.eyebrow{font-family:var(--f-m);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--acento)}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto}
.center{text-align:center;justify-items:center}
.marca{background:var(--titulo);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(34,211,238,.3))}

/* Orbes de fondo */
.orbe{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(110px);max-width:90vw;max-height:90vw}
.orbe.o1{top:-90px;left:6%;width:380px;height:380px;background:var(--orbe1);animation:flota 26s ease-in-out infinite alternate}
.orbe.o2{bottom:40px;right:2%;width:440px;height:440px;background:var(--orbe2);animation:flota 31s ease-in-out infinite alternate-reverse}
.orbe.o3{top:45%;left:50%;width:520px;height:520px;margin:-260px 0 0 -260px;background:var(--orbe3)}
@keyframes flota{to{transform:translate(40px,30px) scale(1.08)}}

/* Cabecera */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--vidrio-fuerte);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--linea);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.topin{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--f-d);font-weight:700;font-size:1.15rem;margin-right:auto;white-space:nowrap}
.logo svg{width:30px;height:30px;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;background:var(--hondo);border:1px solid var(--linea2);font-family:var(--f-m);font-size:.82rem;font-weight:600;font-variant-numeric:tabular-nums}
.chip svg{width:15px;height:15px}
.chip.fire svg{color:var(--alerta)} .chip.xp svg{color:var(--acento)}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--hondo);border:1px solid var(--linea2);flex:none;color:var(--texto);transition:border-color .2s}
.iconbtn:hover{border-color:var(--acento)}
.iconbtn svg{width:18px;height:18px}
.mbar{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.pbar{flex:1;height:8px;border-radius:4px;background:var(--linea2);overflow:hidden}
.pbar i{display:block;height:100%;width:var(--w);border-radius:4px;background:var(--degradado);box-shadow:0 0 14px var(--acento-sombra);animation:fillw .6s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes fillw{from{width:var(--from)}}
.steplab{font-family:var(--f-m);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--acento);min-width:84px;text-align:right}

/* Navegación inferior */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--tarjeta);border-top:1px solid var(--linea);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.navin{max-width:560px;margin:0 auto;display:flex;justify-content:center;gap:2px}
.navb{flex:1;max-width:120px;display:grid;justify-items:center;gap:2px;padding:7px 2px;border-radius:12px;border:1px solid transparent;color:var(--gris);font-size:.74rem;font-weight:600;transition:background .15s,color .15s}
.navb svg{width:21px;height:21px}
.navb[aria-current="page"]{background:var(--activo);border-color:var(--acento-borde);color:var(--acento-texto);box-shadow:0 0 22px var(--acento-sombra)}

main{padding-top:18px;display:grid;gap:16px}
.app[data-anim="1"] .enter{animation:enter .55s cubic-bezier(.2,.9,.3,1.1) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes enter{from{transform:translateY(16px);opacity:.25;filter:blur(3px)}}

/* Tarjetas y botones */
.card{background:var(--vidrio);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--linea);border-radius:26px;padding:20px 18px;box-shadow:var(--sombra);display:grid;gap:14px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:999px;background:var(--boton);color:var(--sobre-acento);
  font-family:var(--f-b);font-weight:700;font-size:15px;letter-spacing:.02em;box-shadow:0 0 24px var(--acento-sombra);transition:transform .1s,box-shadow .2s}
.btn:hover{box-shadow:0 0 34px var(--acento-sombra)}
.btn:active{transform:scale(.97)}
.btn.wide{width:100%}
.btn.tinta{background:linear-gradient(135deg,#67e8f9,#22d3ee);color:#04121a;box-shadow:0 0 24px rgba(34,211,238,.25)}
.btn.sun{background:var(--boton)}
.btn.alt{background:none;border:1.5px solid var(--linea2);color:var(--texto);box-shadow:none}
.btn.alt:hover{border-color:var(--acento)}
.btn.sm{min-height:42px;padding:8px 15px;font-size:13.5px}
.btn.danger{background:none;border:1.5px solid var(--alerta);color:var(--alerta);box-shadow:none;min-height:40px;padding:7px 14px;font-size:13.5px}
.btn.danger.solid{background:var(--alerta);color:#1a0b04}
.btn:disabled{background:var(--linea2);color:var(--gris);box-shadow:none;cursor:not-allowed}
.btn:disabled:active{transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}

/* Espejo, el guía */
.mascot{width:var(--s,96px);height:auto;flex:none;overflow:visible}
.mascot .bodyg{transform-box:view-box;transform-origin:60px 60px;animation:respira 4s ease-in-out infinite}
.mascot .halo{transform-box:view-box;transform-origin:60px 60px;animation:halo 4s ease-in-out infinite}
.mascot .eyes{transform-box:view-box;transform-origin:60px 54px;animation:blink 5s infinite}
.mascot .chispa{animation:titila 2.6s ease-in-out infinite}
.mascot .chispa:nth-of-type(2){animation-delay:.9s} .mascot .chispa:nth-of-type(3){animation-delay:1.7s}
.mascot.m-party .bodyg{animation:salto .9s ease-in-out infinite}
.mascot.m-think .bodyg{animation:inclina 2.6s ease-in-out infinite}
@keyframes respira{50%{transform:translateY(-4px) scale(1.02)}}
@keyframes halo{50%{transform:scale(1.08);opacity:.35}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes titila{50%{opacity:.15}}
@keyframes salto{0%,100%{transform:translateY(0) rotate(0)}35%{transform:translateY(-14px) rotate(-6deg)}65%{transform:translateY(-3px) rotate(5deg)}}
@keyframes inclina{50%{transform:rotate(-7deg)}}
.say{display:flex;gap:12px;align-items:center}
.bubble{position:relative;flex:1;min-width:0;background:var(--vidrio);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--linea2);border-radius:20px 20px 20px 6px;padding:12px 16px;font-weight:500;line-height:1.45;box-shadow:var(--sombra)}
.bubble small{display:block;font-weight:400;margin-top:4px;color:var(--gris);font-size:.85rem}

/* Formularios y opciones */
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--linea2);transition:width .3s,background .3s}
.dots i.on{width:24px;background:var(--degradado)}
input[type=text],textarea{font:inherit;width:100%;border:1px solid rgba(6,182,212,.3);border-radius:14px;padding:13px 15px;background:var(--hondo);color:var(--texto)}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--acento);box-shadow:0 0 0 3px var(--acento-suave)}
input.big{font-family:var(--f-d);font-size:1.4rem;font-weight:700;text-align:center}
textarea{min-height:120px;resize:vertical}
.opts{display:grid;gap:10px}
.opt,.ck{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--hondo);border:1px solid var(--linea2);border-radius:18px;padding:13px 15px;transition:transform .1s,border-color .2s,background .2s}
.opt:hover,.ck:hover{border-color:var(--acento-borde)}
.opt:active,.ck:active{transform:scale(.985)}
.opt .key{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--linea2);display:grid;place-items:center;font-family:var(--f-m);font-weight:600;color:var(--acento)}
.opt .txt{flex:1;min-width:0}
.opt.sel{border-color:var(--tinta);background:var(--tinta-suave)} .opt.sel .key{background:var(--tinta);color:#04121a;border-color:var(--tinta)}
.opt.right{border-color:var(--acento-borde);background:var(--acento-suave);box-shadow:0 0 22px var(--acento-sombra)} .opt.right .key{background:var(--boton);color:var(--sobre-acento);border-color:transparent}
.opt.wrong{border-color:var(--alerta);background:var(--alerta-suave)} .opt.wrong .key{background:var(--alerta);color:#1a0b04;border-color:var(--alerta)}
.opt:disabled{cursor:default}
.verdict{display:block;font-family:var(--f-m);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:3px}
.opt.right .verdict{color:var(--acento)} .opt.wrong .verdict{color:var(--alerta)}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.ck .box{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--linea2);display:grid;place-items:center;color:var(--sobre-acento);transition:all .25s cubic-bezier(.2,.9,.3,1.4)}
.ck .box svg{width:16px;height:16px;stroke-dasharray:30;stroke-dashoffset:30;transition:stroke-dashoffset .3s .05s}
.ck[aria-pressed="true"]{border-color:var(--acento-borde);background:var(--acento-suave)}
.ck[aria-pressed="true"] .box{background:var(--boton);border-color:transparent;box-shadow:0 0 14px var(--acento-sombra);transform:scale(1.1)}
.ck[aria-pressed="true"] .box svg{stroke-dashoffset:0}
.meter4{display:flex;gap:6px}
.meter4 i{flex:1;height:6px;border-radius:3px;background:var(--linea2);transition:background .3s,box-shadow .3s}
.meter4 i.on{background:var(--tinta);box-shadow:0 0 10px rgba(34,211,238,.4)}
.meter4 i.on:nth-child(n+3){background:var(--acento);box-shadow:0 0 10px var(--acento-sombra)}
.tip{background:var(--extra-suave);border:1px solid color-mix(in srgb,var(--extra) 35%,transparent);border-radius:16px;padding:12px 15px;font-size:.94rem}
.tip b{color:var(--extra)}
.prompt{background:var(--hondo);border:1px dashed rgba(34,211,238,.45);border-radius:16px;padding:15px;white-space:pre-wrap;font-size:1rem}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.compare{grid-template-columns:1fr}}
ol.todo{list-style:none;margin:0;padding:0;display:grid;gap:20px}
ol.todo li{display:flex;gap:13px;align-items:flex-start}
ol.todo .num{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-m);font-weight:600;border:1.5px solid var(--tinta);color:var(--tinta);transition:all .25s}
ol.todo .num svg{width:17px;height:17px}
ol.todo li.done .num{background:var(--boton);border-color:transparent;color:var(--sobre-acento);box-shadow:0 0 14px var(--acento-sombra)}
ol.todo .body{flex:1;min-width:0;display:grid;gap:10px}
.apps{display:flex;flex-wrap:wrap;gap:8px}
.appchip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 15px;border-radius:999px;background:var(--hondo);border:1px solid var(--linea2);text-decoration:none;font-weight:600;font-size:.94rem;transition:border-color .2s,transform .1s}
.appchip:hover{border-color:var(--acento-borde)}
.appchip:active{transform:scale(.97)}
.appchip .dot,.pill .dot{width:9px;height:9px;border-radius:50%;background:var(--dc);box-shadow:0 0 8px var(--dc)}
.appchip.sel{border-color:var(--acento-borde);background:var(--acento-suave);color:var(--acento-texto)}
.choice{padding:8px 14px;border-radius:999px;background:var(--hondo);border:1px solid var(--linea2);font-weight:600;font-size:.92rem}
.choice[aria-pressed="true"]{background:var(--activo);border-color:var(--acento-borde);color:var(--acento-texto)}

/* Mundo 3D */
.world{position:relative;height:min(60vh,520px);min-height:340px;border:1px solid var(--linea2);border-radius:26px;overflow:hidden;box-shadow:var(--sombra);background:var(--cielo)}
.world canvas,.preview canvas{display:block;width:100%;height:100%;touch-action:pan-y}
.hud-top{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.hud-bot{position:absolute;left:12px;right:12px;bottom:14px;display:flex;justify-content:center}
.hudchip{background:var(--vidrio-fuerte);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--linea2);border-radius:20px;padding:4px 11px;font-family:var(--f-m);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--acento);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hint{color:var(--gris)}
.preview{position:relative;height:280px;border:1px solid var(--linea2);border-radius:22px;overflow:hidden;background:var(--cielo)}
.swatches{display:flex;flex-wrap:wrap;gap:9px}
.sw{width:38px;height:38px;border-radius:50%;border:1px solid var(--linea2);background:var(--sc);transition:transform .15s,box-shadow .2s}
.sw[aria-pressed="true"]{transform:scale(1.12);box-shadow:0 0 0 3px var(--fondo),0 0 0 5px var(--acento),0 0 18px var(--acento-sombra)}

/* Lista de misiones */
.lvhead{display:flex;align-items:center;gap:13px}
.lvnum{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-d);font-weight:800;font-size:1.35rem;color:var(--lc);border:1.5px solid var(--lc);background:var(--hondo);box-shadow:0 0 18px color-mix(in srgb,var(--lc) 30%,transparent)}
.lvhead.locked .lvnum{--lc:var(--gris);box-shadow:none}
.lvhead .t{flex:1;min-width:0}
.lvmeter{height:6px;border-radius:3px;background:var(--linea2);overflow:hidden;margin-top:8px}

        this.av.position.copy(this.pos(this.at));this.av.rotation.y=Math.PI;this.camPos.copy(this.camTarget());this.look.copy(this.lookTarget());}}},

const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- Cálculos ---------- */
const dayKey=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");};
function streakOf(s){const set=new Set(s.dias||[]);const d=new Date();if(!set.has(dayKey(d)))d.setDate(d.getDate()-1);let n=0;while(set.has(dayKey(d))){n++;d.setDate(d.getDate()-1);}return n;}
function bestStreak(s){const ds=[...new Set(s.dias||[])].sort();let best=0,c=0,prev=null;ds.forEach(k=>{const t=new Date(k+"T12:00:00").getTime();c=(prev&&Math.round((t-prev)/DAY)===1)?c+1:1;best=Math.max(best,c);prev=t;});return best;}
const okOf=(s,id)=>!!(s.res&&s.res[id]&&s.res[id].ok);
const okCount=s=>M.filter(m=>okOf(s,m.id)).length;
const appsOf=s=>{const a=new Set();Object.values(s.res||{}).forEach(r=>(r.apps||[]).forEach(x=>a.add(x)));return a;};
const xpOf=s=>M.reduce((t,m)=>{const r=s.res&&s.res[m.id];return t+(r?r.score*25+(r.ok&&m.mir?50:0):0);},0);
function rankOf(xp){let i=0;RANKS.forEach((r,j)=>{if(xp>=r[0])i=j;});return {i,name:RANKS[i][1],min:RANKS[i][0],next:RANKS[i+1]?RANKS[i+1][0]:null};}
function unlockedFor(s,lv){if(!s.perfil)return false;if(lv<=s.perfil.nivel)return true;const prev=M.filter(m=>m.lv===lv-1);return prev.filter(m=>okOf(s,m.id)).length>=Math.ceil(prev.length*.75);}
const BADGES=[
  {id:"b1",n:"Primer paso",d:"Logra 1 misión",g:"1",c:"#34d399",f:s=>okCount(s)>=1},
  {id:"b2",n:"Guardián",d:"Datos privados",g:"!",c:"#fb923c",f:s=>okOf(s,"m04")},
  {id:"b3",n:"Doble reflejo",d:"Una Prueba Espejo",g:"×2",c:"#22d3ee",f:s=>okOf(s,"m07")||okOf(s,"m10")},
  {id:"b4",n:"Cazainventos",d:"Detecta un invento",g:"?!",c:"#fb923c",f:s=>okOf(s,"m10")},
  {id:"b5",n:"Explorador",d:"Usa 3 IAs",g:"3",c:"#22d3ee",f:s=>appsOf(s).size>=3},
  {id:"b6",n:"Las cinco",d:"Usa las 5 IAs",g:"5",c:"#fde08d",f:s=>appsOf(s).size>=5},
  {id:"b7",n:"Constante",d:"3 días seguidos",g:"3d",c:"#fb923c",f:s=>bestStreak(s)>=3},
  {id:"b8",n:"Navegante",d:"Abre el nivel 3",g:"N3",c:"#c084fc",f:s=>unlockedFor(s,3)},
  {id:"b9",n:"Maestro",d:"Las 12 misiones",g:"12",c:"#fde08d",f:s=>okCount(s)>=12}
];
const badgesOf=s=>BADGES.filter(b=>{try{return b.f(s);}catch(e){return false;}}).map(b=>b.id);
function statusOf(m){const r=S.res[m.id];if(!r)return "new";if(r.ok&&(!r.repaso||r.repaso>Date.now()))return "ok";return "rep";}
function compScores(res){const o={};Object.keys(COMP).forEach(k=>{const ms=M.filter(m=>m.c===k);o[k]=Math.round(ms.reduce((a,m)=>a+(res&&res[m.id]?res[m.id].score:0),0)/(ms.length*4)*100);});return o;}

    ${avEditor(ob.av)}
    <div class="row between"><button class="btn alt sm" data-act="ob-back">Atrás</button><button class="btn" data-act="ob-next">Listo</button></div></section>`;
  if(ob.i>=3&&ob.i<=5){const k=ob.i-3,p=PLACE[k];
    return `${dots}<section class="card enter">
      <div class="say">${mascot("think",80)}<div class="bubble"><span data-type>${esc(p.q)}</span><small>Pregunta ${k+1} de 3. No hay respuestas malas.</small></div></div>
      <div class="opts" role="group">${p.o.map((o,j)=>`<button class="opt enter ${ob.place[k]===j?"sel":""}" style="--i:${j+1}" data-place="${k}:${j}"><span class="key">${"ABC"[j]}</span><span class="txt">${esc(o)}</span></button>`).join("")}</div>
      <div><button class="btn alt sm" data-act="ob-back">Atrás</button></div></section>`;}
  const pts=ob.place.reduce((a,x)=>a+(x||0),0),lv=pts>=4?2:1,L=LEVELS[lv-1];
  return `${dots}<section class="card center enter">${mascot("party",150)}
    <p class="eyebrow">Listo, ${esc(ob.nombre||"")}</p><h1 class="marca">Partes en el Nivel ${lv}</h1>
    <p class="muted">${L.t}: ${L.d}</p>
    <button class="btn wide sun" data-act="ob-fin" data-lv="${lv}">Entrar al mundo</button>
    <button class="btn alt sm" data-act="ob-back">Cambiar respuestas</button></section>`;
}

/* ---------- Mundo ---------- */
function vRuta(){
  const due=dueList(),nx=nextMission(),done=okCount(S);
  const msg=due.length?`Hoy toca repasar: ${due.map(m=>m.t).join(", ")}.`
    :done===0?`Hola, ${S.perfil.nombre}. Toca la plataforma verde que brilla para saltar a tu primera misión.`
    :done===M.length?`¡Completaste las 12 misiones, ${S.perfil.nombre}! Repasa cuando te avise.`
    :`Vas ${done} de ${M.length}, ${S.perfil.nombre}. Sigue con la plataforma que brilla.`;
  const nxLv=nx?LEVELS[nx.lv-1]:LEVELS[2];
  return `<section class="say enter">${mascot(done?"happy":"wow",78)}<div class="bubble" data-type>${esc(msg)}</div></section>
  ${T?`<section class="world enter" id="worldSlot" style="--i:1">
    <div class="hud-top"><span class="hudchip">Nivel ${nxLv.n} · ${nxLv.t}</span><span class="hudchip hint" style="flex:none">↔ girar</span></div>
    <div class="hud-bot">${nx?`<button class="btn sun sm" data-act="ir">Saltar a mi misión ${I.play}</button>`:""}</div></section>`:""}
  ${LEVELS.map(L=>{const open=unlockedFor(S,L.n),ms=M.filter(m=>m.lv===L.n),ok=ms.filter(m=>okOf(S,m.id)).length;
    return `<section class="card enter" style="--i:${L.n+1}">
      <div class="lvhead ${open?"":"locked"}" style="--lc:${L.c};--lcd:${L.cd}"><span class="lvnum">${open?L.n:I.lock.replace("<svg",'<svg width="26" height="26"')}</span>
        <div class="t"><p class="eyebrow">Nivel ${L.n} · ${ok}/${ms.length}</p><h3>${L.t}</h3><div class="lvmeter"><i style="width:${ok/ms.length*100}%"></i></div></div></div>
      ${open?"":`<p class="muted small">Se abre al lograr 3 de 4 misiones del nivel anterior.</p>`}
      <div class="mlist">${ms.map(m=>{const st=open?statusOf(m):"lock",n=M.indexOf(m)+1,isCur=nx&&nx.id===m.id;
        return `<button class="mrow ${open?"":"locked"}" data-m="${m.id}"><span class="blk ${st}">${st==="ok"?I.check:st==="rep"?I.redo:st==="lock"?I.lock:n}</span>
          <span class="t"><b>${esc(m.t)}</b><small>${COMP[m.c]}${st==="ok"?" · lograda":st==="rep"?" · repasar":""}</small></span>
          ${m.mir?`<span class="tag">×2</span>`:""}${isCur?`<span class="go">${st==="rep"?"REPASAR":"JUGAR"}</span>`:""}</button>`;}).join("")}</div>
    </section>`;}).join("")}`;
}
function vSheet(){
  if(!sheet)return "";const m=M.find(x=>x.id===sheet),r=S.res[m.id];
  return `<div class="backdrop" data-act="cerrar-hoja"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(m.t)}"><div class="grab"></div>
    <div class="say">${mascot(m.mir?"wow":"happy",72)}<div class="bubble"><span class="eyebrow">Plataforma ${M.indexOf(m)+1} · ${COMP[m.c]}</span><br>${esc(m.t)}</div></div>
    <p>${esc(m.s)}</p>
    <div class="row"><span class="pill">${I.star.replace("<svg",'<svg width="16" height="16" style="color:var(--acento)"')} hasta ${100+(m.mir?50:0)} XP</span>
      ${m.mir?`<span class="pill" style="--dc:var(--tinta)"><span class="dot"></span>Prueba Espejo: en 2 IAs</span>`:""}
      ${r?`<span class="pill">Último intento: ${r.score}/4</span>`:""}</div>
    <button class="btn wide" data-act="empezar">${r?"Repetir misión":"Empezar misión"} ${I.play}</button>
  </div>`;
}
function renderSheet(){$("#sheet").innerHTML=vSheet();}

/* ---------- Misión ---------- */
function vMision(){
  const m=M.find(x=>x.id===cur);
  if(step===0){const ord=draft.order,ans=draft.quiz,answered=ans!==undefined,right=answered&&ord[ans]==="good";
    return `<section class="card enter">
      <div class="say">${mascot(answered?(right?"party":"think"):"wow",78)}<div class="bubble" data-type>${answered?(right?"¡Exacto! Esa es la forma que funciona.":"Casi. Mira cuál era la buena y por qué."):"¿Cuál de las dos es la mejor forma?"}</div></div>
      <h2>${esc(m.t)}</h2><p class="muted">${esc(m.s)}</p>
      <div class="opts">${ord.map((o,j)=>{const isGood=o==="good",cls=!answered?"":isGood?"right":(ans===j?"wrong":"");
        return `<button class="opt enter ${cls}" style="--i:${j+1}" data-quiz="${j}" ${answered?"disabled":""}><span class="key">${"AB"[j]}</span>
          <span class="txt">${answered?`<span class="verdict">${isGood?"Así sí":"Así no"}</span>`:""}${esc(isGood?m.good:m.bad)}</span></button>`;}).join("")}</div>
      ${answered?`<button class="btn wide" data-step="1">Ahora tú ${I.play}</button>`:""}</section>`;}
  if(step===1){const need=m.mir?2:1,sel=draft.apps||[],ready=sel.length>=need;
    return `<section class="card enter"><p class="eyebrow">${m.mir?"Haz esto en dos IAs distintas":"Haz esto en una IA"}</p>
      <ol class="todo">
        <li class="${draft.copied?"done":""}"><span class="num">${draft.copied?I.check:"1"}</span><div class="body"><h3>Copia este texto</h3>
          <div class="prompt" id="ptext">${esc(m.p)}</div>
          <div class="row"><button class="btn sm${draft.copied?" alt":" tinta"}" data-act="copiar">${I.copy} ${draft.copied?"Copiar otra vez":"Copiar texto"}</button></div>
          ${m.p.includes("[")?`<p class="muted small">Lo que está entre [corchetes] lo cambias por tus datos cuando lo pegues.</p>`:""}</div></li>
        <li class="${ready?"done":""}"><span class="num">${ready?I.check:"2"}</span><div class="body"><h3>${m.mir?"Elige dos IAs y ábrelas":"Elige una IA y ábrela"}</h3>
          <p class="muted small">Al tocarla queda marcada y se abre en otra pestaña.${m.mir?` Llevas ${sel.length} de 2.`:""}</p>
          <div class="apps">${APPS.map(a=>`<a href="${a.u}" target="_blank" rel="noopener" data-pick="${a.id}" class="appchip ${sel.includes(a.id)?"sel":""}" style="--dc:${a.c}"><span class="dot"></span>${a.n}${sel.includes(a.id)?" ✓":""}</a>`).join("")}</div>
          ${sel.length?`<div><button class="btn alt sm" data-act="limpiar-apps">Cambiar elección</button></div>`:""}</div></li>
        <li><span class="num">3</span><div class="body"><h3>Pega, envía y lee</h3>
          <p class="muted small">En la IA, mantén presionado el cuadro donde se escribe y elige «Pegar». Envía, espera la respuesta y vuelve a esta pestaña.</p></div></li>
      </ol>
      <div class="row between"><button class="btn alt sm" data-step="0">Atrás</button><button class="btn" data-step="2" ${ready?"":"disabled"}>Ya tengo la respuesta</button></div>
      ${ready?"":`<p class="muted small">Para seguir, marca ${m.mir?"las dos IAs":"la IA"} en el punto 2.</p>`}</section>`;}
  if(step===2){const n=m.mir?2:1;
    return `<section class="card enter">
      <div class="say">${mascot("think",72)}<div class="bubble" data-type>${m.mir?"Pega las dos respuestas y míralas lado a lado.":"Si quieres, pega la respuesta para mirarla con calma."}</div></div>
      <div class="${m.mir?"compare":""}">${Array.from({length:n},(_,i)=>{const app=APPS.find(a=>a.id===(draft.apps||[])[i]);
        return `<div style="display:grid;gap:6px;min-width:0"><label for="resp${i}"><span class="pill" style="--dc:${app?app.c:"var(--gris)"}"><span class="dot"></span>${app?app.n:"Respuesta"}</span></label><textarea id="resp${i}" placeholder="Pega aquí">${esc((draft.resp||[])[i]||"")}</textarea></div>`;}).join("")}</div>
      ${m.mir?`<p class="tip"><b>Mira:</b> ¿cuál es más clara?, ¿alguna inventó algo?, ¿qué dijo una que la otra no?</p>`:""}
      <p class="muted small">Lo que pegues aquí no se guarda en ninguna parte.</p>
      <div class="row between"><button class="btn alt sm" data-step="1">Atrás</button><button class="btn" data-step="3">Calificar</button></div></section>`;}
  if(step===3){const c=draft.ck||[],n=c.filter(Boolean).length;
    return `<section class="card enter"><h2>¿Qué se cumplió?</h2><p class="muted">Toca cada punto que lograste. Con 3 o más, la misión queda lograda.</p>
      <div class="meter4" id="meter">${[0,1,2,3].map(i=>`<i class="${i<n?"on":""}"></i>`).join("")}</div>
      <div class="opts">${m.ck.map((t,i)=>`<button class="ck enter" style="--i:${i+1}" data-ck="${i}" aria-pressed="${!!c[i]}"><span class="box">${I.check}</span><span>${esc(t)}</span></button>`).join("")}</div>
      <div class="row between"><button class="btn alt sm" data-step="2">Atrás</button><button class="btn sun" data-act="guardar">Ver resultado</button></div></section>`;}
  const R=lastResult||{score:0,ok:false,xp:0,newB:[],levelUp:0};
  return `<section class="card center enter">${mascot(R.ok?"party":"think",130)}
    <h1 class="marca">${R.ok?"¡Misión lograda!":"¡Buen intento!"}</h1>
    <div class="ringwrap"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" style="stroke:var(--linea2)" stroke-width="6"/>
      <circle class="v" cx="60" cy="60" r="52" fill="none" style="stroke:${R.ok?"var(--acento)":"var(--alerta)"};filter:drop-shadow(0 0 8px ${R.ok?"var(--acento-sombra)":"transparent"})" stroke-width="7" stroke-linecap="round" style="--off:${326.7*(1-R.score/4)}"/></svg>
      <div class="lab"><div>${R.score}/4<small>puntos</small></div></div></div>
    ${R.xp>0?`<div class="xpgain marca">+<span data-count="${R.xp}">${R.xp}</span> XP</div>`:`<p class="muted">Tus XP se mantienen.</p>`}
    ${R.levelUp?`<div class="banner">¡Se abrió el Nivel ${R.levelUp}: ${LEVELS[R.levelUp-1].t}!</div>`:""}
    ${R.newB.length?`<p class="eyebrow">Medalla nueva</p><div class="badges" style="width:100%">${R.newB.map(id=>badgeHtml(BADGES.find(b=>b.id===id),true,true)).join("")}</div>`:""}
    <p class="tip" style="text-align:left"><b>Dato:</b> ${esc(m.tip)}</p>
    <p class="muted small">${R.ok?"Volverá a aparecer en unos días para repasar.":"Mañana te la vuelvo a mostrar para repasarla."}</p>
    <button class="btn wide" data-act="a-ruta">Volver al mundo</button></section>`;
}

/* ---------- Avatar, logros, IAs, familia ---------- */
function vAvatar(){return `<section class="card enter"><p class="eyebrow">Tu avatar</p><h2>${esc(S.perfil.nombre)}</h2>
  <p class="muted small">Arrastra para girarlo. Los cambios se guardan solos.</p>${avEditor(curAv())}</section>`;}
function badgeHtml(b,on,isNew){
  return `<div class="badge ${on?"on":""} ${isNew?"new":""}"><svg viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="44" style="fill:var(--hondo);stroke:${on?b.c:"var(--linea2)"}" stroke-width="3"/>
    <circle cx="50" cy="50" r="34" fill="${on?b.c:"none"}" fill-opacity="${on?".18":"0"}" style="stroke:${on?b.c:"var(--linea2)"}" stroke-width="1.5" stroke-dasharray="${on?"0":"4 5"}"/>
    <text x="50" y="59" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-weight="800" font-size="26" style="fill:${on?b.c:"var(--gris)"}">${on?b.g:"?"}</text></svg>
    <b>${b.n}</b><span>${b.d}</span></div>`;
}
function radar(sc){const keys=Object.keys(COMP),cx=170,cy=150,R=100;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/keys.length;return [cx+Math.cos(a)*R*v,cy+Math.sin(a)*R*v];};
  const ring=v=>keys.map((_,i)=>pt(i,v).join(",")).join(" ");
  return `<svg class="radar" viewBox="-50 0 440 300" role="img" aria-label="Radar de competencias">
   ${[.25,.5,.75,1].map(v=>`<polygon points="${ring(v)}" fill="none" style="stroke:var(--linea2)" stroke-width="1.5"/>`).join("")}
   ${keys.map((_,i)=>{const [x,y]=pt(i,1);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" style="stroke:var(--linea2)" stroke-width="1.5"/>`;}).join("")}
   <polygon class="shape" points="${keys.map((k,i)=>pt(i,Math.max(sc[k],3)/100).join(",")).join(" ")}" style="fill:var(--tinta-suave);stroke:var(--tinta)" stroke-width="2.5" stroke-linejoin="round"/>
   ${keys.map((k,i)=>{const [x,y]=pt(i,1.2);const anc=Math.abs(x-cx)<10?"middle":x>cx?"start":"end";return `<text x="${x}" y="${y+4}" text-anchor="${anc}">${COMP[k]}</text>`;}).join("")}</svg>`;}
function vLogros(){
  const xp=xpOf(S),rk=rankOf(xp),sc=compScores(S.res),mine=badgesOf(S),used=appsOf(S);
  const pct=rk.next?Math.round((xp-rk.min)/(rk.next-rk.min)*100):100;
  const hist=M.filter(m=>S.res[m.id]).sort((a,b)=>S.res[b.id].fecha-S.res[a.id].fecha);
  return `<section class="card enter"><div class="hero">${mascot(xp?"happy":"wow",84)}<div style="min-width:0"><p class="eyebrow">Tu rango</p><h2>${rk.name}</h2>
      <p class="big" style="margin-top:6px">${xp} <span class="small muted" style="font-family:var(--f-b)">XP</span></p></div></div>
    <div class="xpbar"><i style="width:${pct}%"></i></div>
    <p class="muted small">${rk.next?`Te faltan ${rk.next-xp} XP para ${RANKS[rk.i+1][1]}.`:"Llegaste al rango máximo."}</p>
    <div class="stats"><div class="stat"><b>${okCount(S)}</b><span>misiones logradas</span></div><div class="stat"><b>${streakOf(S)}</b><span>días seguidos</span></div><div class="stat"><b>${used.size}</b><span>IAs usadas</span></div></div></section>
  <section class="card enter" style="--i:1"><p class="eyebrow">Medallas · ${mine.length} de ${BADGES.length}</p><div class="badges">${BADGES.map(b=>badgeHtml(b,mine.includes(b.id))).join("")}</div></section>
  <section class="card enter" style="--i:2"><p class="eyebrow">Tus seis competencias</p>${radar(sc)}
    <div class="bars">${Object.keys(COMP).map((k,i)=>`<div class="bar"><span>${COMP[k]}</span><span class="track"><span class="fill" style="width:${sc[k]}%;animation-delay:${i*80}ms"></span></span><span class="n">${sc[k]}%</span></div>`).join("")}</div>
    <div class="row">${APPS.map(a=>`<span class="pill" style="--dc:${a.c}"><span class="dot"></span>${a.n}: ${M.filter(m=>S.res[m.id]&&(S.res[m.id].apps||[]).includes(a.id)).length}</span>`).join("")}</div></section>
  <section class="card enter" style="--i:3"><p class="eyebrow">Historial</p>
    ${hist.length?`<div class="tablewrap"><table><thead><tr><th>Misión</th><th>Puntaje</th><th>IA</th><th>Fecha</th><th></th></tr></thead><tbody>
    ${hist.map(m=>{const r=S.res[m.id];return `<tr><td>${esc(m.t)}</td><td class="num">${r.score}/4${r.ok?"":" · repasar"}</td><td>${(r.apps||[]).map(a=>(APPS.find(x=>x.id===a)||{n:a}).n).join(" + ")}</td><td class="num">${new Date(r.fecha).toLocaleDateString("es-CL")}</td>
      <td><span class="confirm"><button class="btn alt sm" data-m="${m.id}">Repetir</button>${confirmUI("res:"+m.id,"Borrar","",true)}</span></td></tr>`;}).join("")}
    </tbody></table></div><p class="muted small">«Repetir» vuelve a hacer la misión y reemplaza el resultado. «Borrar» la deja como nueva.</p>`
    :`<p class="muted">Aún no completas misiones. La primera está en el Mundo.</p>`}</section>
  <section class="card enter" style="--i:4"><p class="eyebrow">Mis datos</p><h3>Cambiar o borrar</h3>
    <label for="editNombre" class="muted small">Nombre o apodo</label>
    <div class="row"><input type="text" id="editNombre" maxlength="30" value="${esc(draft.editNombre??S.perfil.nombre)}" style="flex:1;min-width:0"><button class="btn sm" data-act="guardar-nombre">Guardar</button></div>
    <p class="muted small">Nivel desde el que partes</p>
    <div class="row">${LEVELS.map(L=>`<button class="choice" data-nivel="${L.n}" aria-pressed="${S.perfil.nivel===L.n}">${L.n} · ${L.t}</button>`).join("")}</div>
    <div>${confirmUI("todo","Borrar todo mi progreso","Se borran tu nombre, tu avatar, tus resultados y tu historial. No se puede deshacer.")}</div>
    <p class="muted small">${mode==="compartido"?"Tu progreso se guarda para la familia.":"Tu progreso se guarda en este teléfono o computador."}</p></section>`;
}
function confirmUI(key,label,warn,small){const sm=small?" sm":"";
  if(ask!==key)return `<button class="btn danger${sm}" data-ask="${esc(key)}">${label}</button>`;
  return `<span class="confirm">${warn?`<span class="small">${esc(warn)}</span>`:""}<button class="btn danger solid${sm}" data-do="${esc(key)}">Sí, borrar</button><button class="btn alt${sm}" data-ask="">Cancelar</button></span>`;}
function vIas(){
  const F=[["Rol","Quién quieres que sea","«Actúa como profesor de cocina…»"],["Contexto","Tu situación","«Somos 2 y tengo 30 minutos…»"],["Tarea","Lo que necesitas","«Dame una receta…»"],["Formato","Cómo lo quieres","«…en pasos numerados.»"]];
  return `<section class="card enter"><p class="eyebrow">Las cinco de este mundo</p><h2>Todas se usan igual</h2>
    <p class="muted">Escribes lo que necesitas y te responden. Puedes entrar desde el navegador o bajar su app. Casi todas piden crear una cuenta.</p>
    <div class="ias">${APPS.map(a=>`<a class="ia" href="${a.u}" target="_blank" rel="noopener" style="--dc:${a.c}"><span class="av">${a.n[0]}</span><span class="t"><b>${a.n}</b><span>${a.co}</span></span>${I.ext}</a>`).join("")}</div></section>
  <section class="card enter" style="--i:1"><p class="eyebrow">La fórmula que sirve en las cinco</p><h2>Toca cada tarjeta</h2>
    <div class="flips">${F.map(([t,s,e],i)=>`<button class="flip" data-flip="${i}" aria-label="${t}: ${e}"><span class="in"><span class="face front"><b>${t}</b><span>${s}</span></span><span class="face back">${e}</span></span></button>`).join("")}</div></section>
  <section class="card enter" style="--i:2"><div class="say">${mascot("think",72)}<div class="bubble">Regla de la casa: si no lo dirías en voz alta en una micro llena, no lo escribas en una IA.</div></div>
    <p class="muted small">No escribas claves, números de tarjeta, cuentas bancarias ni tu RUT. Lo que escribes puede quedar guardado en los servidores de cada empresa, y cada una tiene su propia política de privacidad.</p></section>`;
}
function vFamilia(){
  const rows=family.slice().sort((a,b)=>xpOf(b)-xpOf(a));
  const fails={};rows.forEach(p=>Object.entries(p.res||{}).forEach(([k,r])=>{if(!r.ok)fails[k]=(fails[k]||0)+1;}));
  const top=Object.entries(fails).sort((a,b)=>b[1]-a[1]).slice(0,3);
  return `<section class="card enter"><p class="eyebrow">Panel del instructor</p><h2>Avance de la familia</h2>
    <p class="muted small">Solo tú ves esta pestaña. «Quitar» borra el registro de esa persona; si vuelve a entrar, parte de cero.</p>
    ${rows.length?`<div class="tablewrap"><table><thead><tr><th>Persona</th><th>XP</th><th>Logradas</th><th>Más fuerte</th><th>Más débil</th><th>Última vez</th><th></th></tr></thead><tbody>
    ${rows.map(p=>{const sc=compScores(p.res||{}),ks=Object.keys(sc).sort((a,b)=>sc[b]-sc[a]),ok=okCount(p);
      return `<tr><td><b>${esc(p.perfil&&p.perfil.nombre||"Sin nombre")}</b></td><td class="num">${xpOf(p)}</td><td class="num">${ok}/${M.length}</td><td>${ok?COMP[ks[0]]:"—"}</td><td>${ok?COMP[ks[ks.length-1]]:"—"}</td>
      <td class="num">${p.actualizado?new Date(p.actualizado).toLocaleDateString("es-CL"):"—"}</td><td>${p._id===myId?`<span class="muted small">Tú</span>`:confirmUI("fam:"+p._id,"Quitar","",true)}</td></tr>`;}).join("")}
    </tbody></table></div>`:`<p class="muted">Aún no hay nadie registrado. Comparte esta página con tu familia.</p>`}</section>
  <section class="card enter" style="--i:1"><p class="eyebrow">Dónde más cuesta</p>
    ${top.length?`<div class="bars">${top.map(([k,n])=>`<div class="bar"><span>${esc(M.find(m=>m.id===k).t)}</span><span class="track"><span class="fill" style="width:${Math.min(100,n/Math.max(rows.length,1)*100)}%;background:var(--alerta)"></span></span><span class="n">${n}</span></div>`).join("")}</div>`:`<p class="muted">Sin misiones por repasar todavía.</p>`}</section>`;
}

/* ---------- Render ---------- */
function typeAll(){if(reduce)return;document.querySelectorAll("#app [data-type]").forEach(el=>{const t=el.textContent;el.textContent="";let i=0;const go=()=>{i+=2;el.textContent=t.slice(0,i);if(i<t.length)setTimeout(go,22);};go();});}
function countUp(){document.querySelectorAll("[data-count]").forEach(el=>{const to=+el.dataset.count;if(reduce){el.textContent=to;return;}const t0=performance.now();
  const f=now=>{const p=Math.min(1,(now-t0)/1000);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f);};requestAnimationFrame(f);});}
function render(){
  const app=$("#app");const key=(S.perfil?"p":"o")+"|"+view+"|"+step+"|"+ob.i+"|"+(cur||"");
  const anim=key!==lastKey;lastKey=key;app.dataset.anim=anim?"1":"0";
  $("#top").innerHTML=vTop();
  const showNav=!!S.perfil&&view!=="mision";const nav=$("#nav");nav.hidden=!showNav;nav.innerHTML=showNav?vNav():"";
  document.body.classList.toggle("has-nav",showNav);
  if(!S.perfil)app.innerHTML=vOnboard();
  else if(view==="mision")app.innerHTML=vMision();
  else if(view==="avatar")app.innerHTML=vAvatar();
  else if(view==="logros")app.innerHTML=vLogros();
  else if(view==="ias")app.innerHTML=vIas();
  else if(view==="familia"&&isOwner)app.innerHTML=vFamilia();
  else{view="ruta";app.innerHTML=vRuta();}
  renderSheet();
  const ws=$("#worldSlot");if(ws){if(!W3.mount(ws))ws.remove();else if(cheerPending){cheerPending=false;setTimeout(()=>{W3.celebrate();},350);}}
  const as=$("#avatarSlot");if(as&&T)PV.mount(as,curAv());
  if(anim){typeAll();countUp();}
}
function go(fn){fn();render();window.scrollTo({top:0,behavior:reduce?"auto":"smooth"});}
window.addEventListener("resize",()=>{const ws=$("#worldSlot");if(ws&&W3.ok)W3.fit(ws);const as=$("#avatarSlot");if(as&&PV.ok)PV.fit(as);
  if(Conf.run){const c=$("#confetti"),d=window.devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d;Conf.x.setTransform(d,0,0,d,0,0);}});

/* ---------- Eventos ---------- */
document.addEventListener("input",e=>{const id=e.target.id;
  if(id==="nombre")ob.nombre=e.target.value;
  if(id==="editNombre")draft.editNombre=e.target.value;
  if(id&&id.startsWith("resp")){draft.resp=draft.resp||[];draft.resp[+id.slice(4)]=e.target.value;}});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="nombre"){e.preventDefault();$('[data-act="ob-name"]').click();}
  if(e.key==="Escape"&&sheet){sheet=null;renderSheet();}});
document.addEventListener("click",e=>{
  const pick=e.target.closest("a[data-pick]");
  if(pick){const m=M.find(x=>x.id===cur);let a=draft.apps||[];const id=pick.dataset.pick;if(!a.includes(id)){a.push(id);if(a.length>(m.mir?2:1))a.shift();}
    draft.apps=a;Snd.play("coin");buzz(10);setTimeout(render,60);return;}
  if(e.target.closest(".backdrop")){sheet=null;Snd.play("tap");renderSheet();return;}
  const b=e.target.closest("button");if(!b||b.disabled)return;
  Snd.play("tap");const act=b.dataset.act;
  if(act==="tema"){const nx=isDark()?"light":"dark";document.documentElement.setAttribute("data-theme",nx);try{localStorage.setItem("me-tema",nx);}catch(err){}themeChanged();return;}
  if(act==="sonido"){Snd.on=!Snd.on;try{localStorage.setItem("me-snd",Snd.on?"1":"0");}catch(err){}if(Snd.on)Snd.play("right");render();return;}
  /* avatar */
  if(b.dataset.av){const k=b.dataset.av,v=b.dataset.val,av=S.perfil?Object.assign({},curAv()):ob.av;av[k]=v;
    document.querySelectorAll(`[data-av="${k}"]`).forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
    if(S.perfil){S.perfil.av=av;clearTimeout(avTimer);avTimer=setTimeout(persist,700);}
    if(PV.ok){PV.set(av);PV.cheer();}Snd.play("pop");buzz(10);return;}
  /* bienvenida */
  if(act==="ob-next"){Snd.play("next");go(()=>ob.i++);return;}
  if(act==="ob-name"){const n=(ob.nombre||"").trim();if(!n){toast("Escribe tu nombre o apodo");Snd.play("wrong");const inp=$("#nombre");inp.classList.add("shake");inp.focus();return;}Snd.play("next");go(()=>ob.i=2);return;}
  if(b.dataset.place){const [k,j]=b.dataset.place.split(":").map(Number);ob.place[k]=j;
    document.querySelectorAll(`[data-place^="${k}:"]`).forEach(x=>x.classList.toggle("sel",x===b));Snd.play("pop");buzz(10);
    setTimeout(()=>{if(ob.i!==k+3)return;ob.i++;if(ob.i===6){Snd.play("win");setTimeout(()=>Conf.burst(120),150);}render();},380);return;}
  if(act==="ob-back"){go(()=>ob.i=Math.max(1,ob.i-1));return;}
  if(act==="ob-fin"){S.perfil={nombre:(ob.nombre||"").trim(),nivel:+b.dataset.lv,inicio:Date.now(),av:Object.assign({},ob.av)};ob={i:0,place:[],av:Object.assign({},DEF_AV)};persist();Snd.play("level");go(()=>view="ruta");return;}
  /* mundo */
  if(b.dataset.tab){ask=null;go(()=>view=b.dataset.tab);return;}
  if(act==="ir"){const nx=nextMission();if(!nx)return;const i=M.indexOf(nx);W3.goTo(i,()=>{sheet=nx.id;Snd.play("open");renderSheet();});return;}
  if(b.dataset.m){const m=M.find(x=>x.id===b.dataset.m);
    if(!unlockedFor(S,m.lv)){Snd.play("wrong");buzz(30);b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");toast("Se abre al lograr 3 de 4 misiones del nivel anterior");return;}
    if(W3.ok&&view==="ruta")W3.goTo(M.indexOf(m));
    sheet=m.id;Snd.play("open");renderSheet();return;}
  if(act==="cerrar-hoja"){sheet=null;renderSheet();return;}
  if(act==="empezar"){cur=sheet;sheet=null;step=0;draft={order:Math.random()<.5?["good","bad"]:["bad","good"]};Snd.play("next");go(()=>view="mision");return;}
  if(act==="salir"){go(()=>{view="ruta";cur=null;});return;}
  if(act==="a-ruta"){if(lastResult&&lastResult.ok)cheerPending=true;W3.at=M.findIndex(m=>m.id===cur);if(W3.av)W3.av.position.copy(W3.pos(W3.at));go(()=>{view="ruta";cur=null;});return;}
  /* misión */
  if(b.dataset.quiz!==undefined){const j=+b.dataset.quiz;draft.quiz=j;const right=draft.order[j]==="good";Snd.play(right?"right":"wrong");buzz(right?15:40);render();
    if(!right){const el=document.querySelector(`[data-quiz="${j}"]`);if(el)el.classList.add("shake");}else Conf.burst(40);return;}
  if(b.dataset.step){Snd.play("next");go(()=>step=+b.dataset.step);return;}
  if(act==="copiar"){const t=M.find(x=>x.id===cur).p;const ok=()=>{draft.copied=true;Snd.play("copy");render();toast("Copiado. Ahora elige la IA");};
    try{navigator.clipboard.writeText(t).then(ok,()=>selectPrompt());}catch(err){selectPrompt();}return;}
  if(act==="limpiar-apps"){draft.apps=[];render();return;}
  if(b.dataset.ck!==undefined){draft.ck=draft.ck||[];const i=+b.dataset.ck;draft.ck[i]=!draft.ck[i];const n=draft.ck.filter(Boolean).length;
    b.setAttribute("aria-pressed",String(!!draft.ck[i]));document.querySelectorAll("#meter i").forEach((x,j)=>x.classList.toggle("on",j<n));
    if(draft.ck[i]){Snd.play("check",n-1);buzz(12);}else Snd.play("uncheck");return;}
  if(act==="guardar"){
    const before={xp:xpOf(S),b:badgesOf(S),l:[unlockedFor(S,2),unlockedFor(S,3)]};
    const score=(draft.ck||[]).filter(Boolean).length,ok=score>=3,prev=S.res[cur];
    const racha=ok?((prev&&prev.ok?prev.racha||0:0)+1):0,gap=ok?[2,5,10][Math.min(racha-1,2)]:1;
    S.res[cur]={score,ok,apps:draft.apps||[],fecha:Date.now(),intentos:(prev?prev.intentos||0:0)+1,racha,repaso:(ok&&racha>3)?0:Date.now()+gap*DAY};
    S.dias=[...new Set([...(S.dias||[]),dayKey(Date.now())])].slice(-120);persist();
    const nb=badgesOf(S).filter(x=>!before.b.includes(x)),lu=[2,3].find((l,i)=>!before.l[i]&&unlockedFor(S,l))||0;
    lastResult={score,ok,xp:Math.max(0,xpOf(S)-before.xp),newB:nb,levelUp:lu};go(()=>step=4);
    if(ok){setTimeout(()=>Conf.burst(lu?220:150),250);Snd.play(lu?"level":"win");buzz([20,40,20]);}else Snd.play("soft");
    if(nb.length)setTimeout(()=>Snd.play("badge"),1100);return;}
  /* logros y datos */
  if(b.dataset.flip!==undefined){b.classList.toggle("on");Snd.play("pop");return;}
  if(b.dataset.ask!==undefined){ask=b.dataset.ask||null;render();return;}
  if(b.dataset.do){const k=b.dataset.do;ask=null;
    if(k==="todo"){S={perfil:null,res:{},dias:[],actualizado:0};draft={};ob={i:0,place:[],av:Object.assign({},DEF_AV)};W3.at=-1;
      try{localStorage.removeItem(KEY);}catch(err){}if(docRef){const r=docRef;saving=saving.then(()=>r.delete()).catch(()=>{});}
      Snd.play("soft");go(()=>view="ruta");toast("Progreso borrado");return;}
    if(k.startsWith("res:")){delete S.res[k.slice(4)];persist();render();toast("Resultado borrado");return;}
    if(k.startsWith("fam:")&&dbRef){dbRef.collection("progreso").doc(k.slice(4)).delete().then(()=>toast("Registro quitado"),()=>toast("No se pudo quitar. Intenta de nuevo."));render();return;}
    render();return;}
  if(b.dataset.nivel){S.perfil.nivel=+b.dataset.nivel;persist();render();toast("Nivel actualizado");return;}
  if(act==="guardar-nombre"){const n=(draft.editNombre??S.perfil.nombre).trim();if(!n){toast("El nombre no puede quedar vacío");return;}
    S.perfil.nombre=n;delete draft.editNombre;persist();Snd.play("right");render();toast("Nombre guardado");return;}
});
function selectPrompt(){const el=$("#ptext");if(!el)return;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Texto seleccionado: cópialo con el menú");}

function themeChanged(){if(W3.ok)W3.applyTheme();if(PV.ok)PV.applyTheme();render();}
try{matchMedia("(prefers-color-scheme: light)").addEventListener("change",()=>{if(!document.documentElement.hasAttribute("data-theme"))themeChanged();});}catch(e){}
try{const tm=localStorage.getItem("me-tema");if(tm)document.documentElement.setAttribute("data-theme",tm);}catch(e){}
render();

/* ---------- Registro compartido (solo dentro de claude.ai) ---------- */
(async()=>{
  if(!window.claude||!window.claude.use)return;
  const [user,db]=await Promise.all([claude.use("user"),claude.use("db")]);
  if(!user||!db)return;
  try{
    isOwner=await user.isOwner();const uid=await user.id();myId=uid;dbRef=db;
    docRef=db.collection("progreso").doc(uid);const snap=await docRef.get();
    if(snap.exists){const d=snap.data();
      if((d.actualizado||0)>=(S.actualizado||0)){S=Object.assign({perfil:null,res:{},dias:[],actualizado:0},JSON.parse(JSON.stringify(d)));try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
      else persist();mode="compartido";}
    else if(S.perfil)persist();
    if(isOwner)db.collection("progreso").onSnapshot(qs=>{family=qs.docs.filter(d=>d.exists).map(d=>Object.assign({_id:d.id},d.data()));if(view==="familia")render();},()=>{});
    if(view!=="mision")render();
  }catch(e){docRef=null;mode="local";}
})();
})();
</script>
